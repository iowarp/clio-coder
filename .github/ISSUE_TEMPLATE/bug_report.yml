name: Bug report
description: Report something that went wrong in Clio Coder.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Describe what went wrong. A few sentences are enough.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen instead.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, if you have them
      description: Commands, config shape, or session steps that bring it back.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Terminal
        - Headless run
        - Editor over ACP
        - Desktop app
        - Installer
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "`clio-coder --version` and your target and model; `/report` fills this."
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Only the relevant log lines. Remove API keys, host names and private source.
      render: text
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Filled by /report. Leave empty when writing by hand.
    validations:
      required: false
