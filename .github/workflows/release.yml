name: release

# Release flow: push a tag `vX.Y.Z` that matches package.json's version. The
# full deterministic gate — typecheck, lint, skills pins, build, tests, dist
# integrity, and the package-content audit — runs once before the GitHub
# release is created with the tarball attached.
#
# npm publishing is deferred until the first stable v0.3.0: the publish step
# is disabled by its `if: false` guard. To re-enable, flip the guard, set the
# `NPM_TOKEN` repository secret (a granular automation token with publish
# rights for @iowarp), and update README's distribution note. Once the package
# exists on npm, this can be switched to npm trusted publishing (OIDC) and the
# secret removed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install fd-find and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
      # The SciCode adapter contract runs benchmark grading through uv.
      - name: Install uv
        run: pipx install uv
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Run the release gate
        run: npm run ci:release
      - name: Publish to npm (disabled until stable v0.3.0)
        if: ${{ false }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack tarball for the GitHub release
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./iowarp-clio-coder-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
