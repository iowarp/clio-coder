name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  qualify:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$pkg"
      - name: Qualify exact package
        id: candidate
        run: node scripts/release-candidate.mjs qualify-after-ci
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-package
          path: ${{ steps.candidate.outputs.artifact }}*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qualified-package
          path: ${{ runner.temp }}/qualified-package
      - name: Create GitHub release from qualified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd "$RUNNER_TEMP/qualified-package" && sha256sum --check candidate.tgz.sha256)
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/qualified-package/candidate.tgz" \
            --title "Clio Coder $version" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
