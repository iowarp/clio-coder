name: release

# Publishing flow: push a tag `vX.Y.Z` that matches package.json's version.
# `npm publish` runs `prepublishOnly` (ci:release), so the full deterministic
# gate — typecheck, lint, skills pins, build, tests, dist integrity, and the
# package-content audit — runs exactly once before anything leaves the runner.
#
# Requires the `NPM_TOKEN` repository secret (a granular automation token with
# publish rights for @iowarp). Once the package exists on npm, this can be
# switched to npm trusted publishing (OIDC) and the secret removed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install fd-find and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Publish to npm (runs ci:release via prepublishOnly)
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack tarball for the GitHub release
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./iowarp-clio-coder-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
