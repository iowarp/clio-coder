name: release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact qualified commit (must be this version branch head)
        required: true
        type: string
      qualification_run:
        description: Successful ci.yml run that owns the candidate artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the exact branch head
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: test "$CANDIDATE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-${{ inputs.sha }}'
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
      - name: Verify qualification and present the approval receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: node scripts/release-publish.mjs verify --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA" --run "$QUALIFICATION_RUN" --branch "$GITHUB_REF_NAME"

  release:
    needs: preflight
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-${{ inputs.sha }}'
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
      # The App's pushes trigger the existing gh-pages deployment. GITHUB_TOKEN
      # pushes would leave Pages stale, and cannot bypass protected release refs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: publisher
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: iowarp
          repositories: clio-coder
          permission-contents: write
          permission-workflows: write
          permission-actions: read
      - name: Publish the qualified bytes and finish the release
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          node scripts/release-publish.mjs publish --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA" --run "$QUALIFICATION_RUN" --branch "$GITHUB_REF_NAME"
