name: release

# Release flow: push a tag `vX.Y.Z` that matches package.json's version. The
# full deterministic gate — typecheck, lint, skills pins, build, tests, dist
# integrity, and the package-content audit — runs once before the GitHub
# release is created with the tarball attached.
#
# npm publishing from CI is gated on the repository variable `NPM_PUBLISH`
# being the string "true" AND the `NPM_TOKEN` secret (a granular automation
# token with publish rights for @iowarp). With the variable unset the step is
# skipped and the GitHub release is still created, so a tag push never breaks
# on a missing secret. The first publish may instead be run manually by a
# maintainer (`npm login && npm publish`); `prepublishOnly` runs the same
# `ci:release` gate either way. Once the package exists on npm, switch this
# step to npm trusted publishing (OIDC) and remove the secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install fd-find and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
      # The SciCode adapter contract runs benchmark grading through uv.
      - name: Install uv
        run: pipx install uv
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Run the release gate
        run: npm run ci:release
      - name: Publish to npm (enable via repo variable NPM_PUBLISH=true)
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack tarball for the GitHub release
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./iowarp-clio-coder-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
