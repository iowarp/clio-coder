name: release

# Release flow: push a tag `vX.Y.Z` that matches package.json's version, after
# the `ci` workflow has gone green on that same commit. This job does not
# re-run the test suite. It verifies that ci already passed for the tagged SHA,
# builds dist/, audits the packed artifact with scripts/check-release.mjs, and
# creates the GitHub release with the tarball attached.
#
# There is no npm publish path here. Publishing is a manual maintainer step
# (`npm login && npm publish`), and `prepublishOnly` runs the full `ci:release`
# gate on the maintainer's machine at that point.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  actions: read # read the ci run status for this commit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The tag inherits ci's verdict rather than repeating it. A tag pushed
      # before ci finishes fails here instead of publishing unverified code.
      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "$count" = "0" ]; then
            echo "no successful ci run for $GITHUB_SHA; push the tag after ci passes" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version $pkg does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build dist for the artifact audit
        run: npm run build
      - name: Audit dist and package contents
        run: node scripts/check-release.mjs
      - name: Pack tarball for the GitHub release
        run: npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./iowarp-clio-coder-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
