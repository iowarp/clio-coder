name: ci

on:
  push:
    branches: [main, "v[0-9][0-9][0-9]", "ci-scratch-**"]
  pull_request:
    branches: [main, "v[0-9][0-9][0-9]"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (22)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run check:gui
      - run: pnpm --filter @iowarp/clio-coder-gui build
      - run: pnpm run test:gui
      - run: pnpm run test:maintenance

  core-tests:
    name: core tests (22, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install native search tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep fd-find
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Contract and smoke tests (shard ${{ matrix.shard }}/3)
        run: pnpm run test --test-shard=${{ matrix.shard }}/3

  runtime-compatibility:
    name: ci (24)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supported Node runtime boundaries
        run: pnpm run test:file -- tests/contracts/engine-lifecycle.test.ts tests/contracts/provider-transport.test.ts tests/contracts/session-durability.test.ts

  windows-subprocess:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:file tests/contracts/antigravity-subprocess.test.ts tests/contracts/bash-exec-settlement.test.ts tests/contracts/windows-process-tree.test.ts

  ci:
    name: ci (22)
    needs: [checks, core-tests, windows-subprocess]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Node 22 gate
        run: |
          test '${{ needs.checks.result }}' = success
          test '${{ needs.core-tests.result }}' = success
          test '${{ needs.windows-subprocess.result }}' = success

  candidate-qualification:
    if: ${{ startsWith(github.ref, 'refs/heads/ci-scratch-') }}
    needs: [ci, runtime-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-candidate.mjs qualify-after-ci
