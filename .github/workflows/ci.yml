name: ci
run-name: ${{ inputs.nonce || format('ci {0}', inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to qualify (must be this branch head)
        required: true
        type: string
      rehearse:
        description: Rehearse publication without public writes (ci-scratch-* or rehearse/* only)
        default: false
        type: boolean
      version_branch:
        description: Version branch for the release plan (empty means the dispatched branch)
        required: false
        type: string
      platforms:
        description: Also boot the same package on Windows and macOS
        default: false
        type: boolean
      browser:
        description: Also run the GUI browser smoke in Chrome (opt-in, not a required check)
        default: false
        type: boolean
      nonce:
        description: Caller's unique run name, so the caller finds this run without comparing clocks
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qualify-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require the exact candidate
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          if test "$REHEARSE" = true; then
            case "$GITHUB_REF_NAME" in ci-scratch-*|rehearse/*) ;; *) exit 1 ;; esac
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check, build, pack once, and prepare the website
        run: node scripts/release-candidate.mjs prepare --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ci:
    name: ci (22)
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful preparation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARE_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native search tools
        run: sudo apt-get install --yes --no-install-recommends ripgrep fd-find
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Selected contracts, GUI behavior, and installed package
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/release-candidate.mjs test --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate/test-results.json
          if-no-files-found: error
          retention-days: 30

  runtime-compatibility:
    name: ci (24)
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require successful preparation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARE_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native search tools
        run: sudo apt-get install --yes --no-install-recommends ripgrep fd-find
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate
      # The same tests as ci (22): 0.7.0 passed a Node 24-only check and failed on Node 22.
      - name: Selected contracts, GUI behavior, and installed package on Node 24
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/release-candidate.mjs test --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA" --results test-results-24.json
      - name: Boot the qualified package on Node 24
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/release-candidate.mjs smoke --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results24-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate/test-results-24.json
          if-no-files-found: error
          retention-days: 30

  platform:
    name: boot (${{ matrix.os }})
    if: ${{ inputs.platforms }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Preserve committed bytes on Windows
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ inputs.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Boot the qualified package
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/candidate
        run: node scripts/release-candidate.mjs smoke --directory "$CANDIDATE_DIRECTORY" --sha "$CANDIDATE_SHA"

  browser-smoke:
    name: browser smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @iowarp/clio-coder-gui build
      - name: Drive the GUI in the runner's Chrome
        run: pnpm --filter @iowarp/clio-coder-gui smoke:browser --chrome /usr/bin/google-chrome --out "$RUNNER_TEMP/browser-smoke"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Kept outside the *-<sha> pattern the rehearsal jobs merge into the candidate.
          name: browser-smoke-output
          path: ${{ runner.temp }}/browser-smoke
          if-no-files-found: ignore
          retention-days: 14

  rehearsal-preflight:
    if: ${{ inputs.rehearse }}
    needs: [ci, runtime-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-${{ inputs.sha }}'
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Verify the staged publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          VERSION_BRANCH: ${{ inputs.version_branch || github.ref_name }}
        run: node scripts/release-publish.mjs rehearse-preflight --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --branch "$VERSION_BRANCH"

  rehearsal:
    if: ${{ inputs.rehearse }}
    needs: rehearsal-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-${{ inputs.sha }}'
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Rehearse publication using the tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          VERSION_BRANCH: ${{ inputs.version_branch || github.ref_name }}
        run: node scripts/release-publish.mjs rehearse --directory "$RUNNER_TEMP/candidate" --sha "$CANDIDATE_SHA" --run "$GITHUB_RUN_ID" --branch "$VERSION_BRANCH"
