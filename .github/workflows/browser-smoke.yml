name: browser smoke

# Its own workflow so push and pull-request runs never create skipped "ci (22)" and "ci (24)" check runs, which
# branch protection would count as passing. ci.yml calls it for a dispatch with the browser input.
on:
  push:
    branches: ['v[0-9][0-9][0-9]*']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use runner scratch for temporary files
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iowarp/clio-coder-gui build
      # The fixture harness runs the checkout's CLI from source, so the smoke needs no root build.
      - name: Drive the GUI in the runner's Chrome
        run: pnpm --filter @iowarp/clio-coder-gui smoke:browser --chrome /usr/bin/google-chrome --out "$RUNNER_TEMP/browser-smoke"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Kept outside the *-<sha> pattern the rehearsal jobs merge into the candidate.
          name: browser-smoke-output
          path: ${{ runner.temp }}/browser-smoke
          if-no-files-found: ignore
          retention-days: 14
