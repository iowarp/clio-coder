name: pages

# Publishes site/ to https://coder.iowarp.ai once it is on main. Deploys when
# the site or the two installers it serves change, and on manual dispatch.
# Before 0.6.0 the site is published from the gh-pages branch by
# site/publish-pages.sh instead, and Pages stays on "Deploy from a branch" until
# the maintainer switches the source to GitHub Actions. This workflow never
# touches the ci or release jobs.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned documentation commit must be reachable for the provenance check.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify the pinned documentation snapshot
        run: |
          node site/deployment-check.mjs
          python3 site/sync-docs.py --check
      - name: Build the site
        run: node site/build.mjs --out "$RUNNER_TEMP/site" --revision "$GITHUB_SHA"
      - name: Check the built site
        run: python3 site/check.py "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
