server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare records the browser scheme; the tunnel itself uses HTTP.
    if ($http_cf_visitor ~ '"scheme"\s*:\s*"http"') {
        return 308 https://coder.iowarp.ai$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'" always;

    # Revalidate stable asset names and HTML after each deployment.
    expires -1;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.html {
        # An internal index lookup must serve HTML, not redirect back to itself.
        if ($request_uri ~ "^/index\.html(?:\?|$)") {
            return 308 /;
        }
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
