server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare records the browser scheme; the tunnel itself uses HTTP.
    if ($http_cf_visitor ~ '"scheme"\s*:\s*"http"') {
        return 308 https://coder.iowarp.ai$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy comes from clio-revision.conf: the build hashes the inline theme script.

    # Revalidate stable asset names and HTML after each deployment.
    expires off;
    add_header Cache-Control "no-cache, no-transform" always;

    # llms.txt, llms-full.txt and sitemap.xml are text for crawlers; compress them
    # and declare UTF-8 so their typography survives plain-text clients.
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/clio-redirects.conf;
    include /etc/nginx/clio-revision.conf;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.html {
        # An internal index lookup must serve HTML, not redirect back to itself.
        if ($request_uri ~ "^/index\.html(?:\?|$)") {
            return 308 "/$is_args$args";
        }
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
