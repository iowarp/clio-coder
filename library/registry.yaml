        name: wtfp-argument-verifier
        description: Verify that completed section text actually delivers the claims,
          evidence, constraints, and connections promised by its plan. Execution
          summaries are navigation aids, not proof; verdicts must be grounded in
          the manuscript itself.
      - kind: agent
        name: wtfp-citation-expert
