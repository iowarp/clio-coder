        name: hpc-chronolog
        description: "Uses ChronoLog as durable, time-ordered memory for HPC runs
          through its MCP server: chrono-mcp from a released ChronoLog 3.x tree,
          or chronolog-mcp from an unreleased ChronoLog 4.0 development build.
          Records run events and reads them back, quoting what the"
      - kind: skill
        name: hpc-darshan
        description: "Characterizes an application's I/O from a Darshan log: runs
