          installing software or for writing the job script's science.
      - kind: skill
        name: hpc-parallel-io
        description: Writes or reviews parallel HDF5 and MPI-IO code so many ranks share
          one file correctly and collectively, and checks the result with
          Darshan counters. Not for serial file reading; not for choosing the
          science stored in the file.
      - kind: skill
        name: hpc-sweep
        description: "Runs a Slurm parameter sweep as an experiment: plans a job array
