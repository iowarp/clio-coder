  - kind: plugin
    name: materio
    description: "Materio: materials research interviews, supplied-corpus synthesis,
      lab feasibility, task execution and verified paper handoff."
    version: 0.2.1
    sourceUrl: plugins/materio
    sha256: 57a38ba5a0061445f9e75b4cd622bfe9a066eeebd509f78f1b55177076238a20
    provides:
      - kind: agent
        name: materio-lab-definer
        description: Structure resource interviews into a feasibility map with gaps and
          alternatives.
      - kind: agent
        name: materio-literature-reviewer
        description: Review supplied materials and provided URLs with citation
          provenance and explicit gaps.
      - kind: agent
        name: materio-research-explorer
        description: Synthesize candidate materials-science questions and write
          researcher-confirmed identity.
      - kind: agent
        name: materio-task-executor
        description: Produce type-specific artifacts for one approved materials-science
          task and verify the files.
      - kind: agent
        name: materio-task-verifier
        description: Independently read task artifacts and validate completeness,
          assumptions, and supported claims.
      - kind: agent
        name: materio-workflow-planner
        description: Build a resource-aware dependency plan with researcher assumptions
          and tagged defaults.
      - kind: playbook
        name: materio-execute-task
        description: Execute one pre-approved research task and independently inspect
          its output files.
      - kind: prompt
        name: materio:add-task
        description: Add a new task to the research workflow
      - kind: prompt
        name: materio:archive-task
        description: Archive a task; moves it to the Archived section of WORKFLOW.md,
          out of active execution
      - kind: prompt
        name: materio:checkpoint
        description: Save, inspect, or restore a validated research checkpoint archive.
      - kind: prompt
        name: materio:define-research-tasks
        description: Build a research workflow; select from traditional templates or
          create from scratch, with assumption interviews per task
      - kind: prompt
        name: materio:define-virtual-lab
        description: Interview to map all available lab resources; equipment, HPC,
          software, collaborations; into a VIRTUAL-LAB.md that guides feasible
          task planning
      - kind: prompt
        name: materio:execute-task
        description: Execute a specific research task or the entire workflow
      - kind: prompt
        name: materio:help
        description: Overview of Materio commands, workflow, and philosophy
      - kind: prompt
        name: materio:identify-research
        description: Start exploring a research subject; guided interview to select
          fields, define scope, and generate a research prompt
      - kind: prompt
        name: materio:literature-review
        description: Conduct literature review, identify research gaps, and define
          search keywords
      - kind: prompt
        name: materio:pause-research
        description: Save the current research position and pause active work.
      - kind: prompt
        name: materio:progress
        description: Show research progress with statusline, recent work, and smart
          routing to next action
      - kind: prompt
        name: materio:remove-task
        description: Remove a task from the research workflow permanently
      - kind: prompt
        name: materio:resume-research
        description: Resume research from a paused state; shows current position and
          suggests next action
      - kind: prompt
        name: materio:settings
        description: Inspect or update research network, checkpoint, and commit settings.
      - kind: prompt
        name: materio:status
        description: Show full research project dashboard; identity, workflow progress,
          data, and next action
      - kind: prompt
        name: materio:upload-data
        description: Register and index data files, papers, or datasets for use in
          research tasks
      - kind: prompt
        name: materio:wtfp
        description: Prepare a reviewed research-to-paper handoff for the wtf-p workflow.
