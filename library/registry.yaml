          claims and analyze whether the existing bibliography covers the
          approved argument. Every recommendation must be grounded in resolvable
          scholarly metadata and its relevance must be explained "
      - kind: agent
        name: wtfp-citation-formatter
        description: Audit bibliography integrity and produce deterministic corrections
          without touching the primary bibliography. The role cross-references
          manuscript citation keys, detects missing and unused entries,
          identifies likely duplicates, and normalizes records while
      - kind: agent
        name: wtfp-coherence-checker
        description: Evaluate the manuscript as a connected argument rather than a set
          of individually acceptable sections. Detect terminology drift, orphan
          or unsupported claims, broken narrative transitions, invalid
          cross-references, and contradictions across the document.
      - kind: agent
        name: wtfp-outliner
        description: Turn the approved project brief into the structural foundation for
          an academic document. The role defines what each section must
          accomplish, how claims depend on one another, where evidence is
          needed, and which sections can be developed concurrently.
      - kind: agent
        name: wtfp-plan-checker
        description: "Determine whether proposed section plans are likely to produce the
          intended academic outcome. Verification is goal-backward: a
          syntactically complete plan still fails if it omits a claim, lacks
          usable evidence, contradicts an author decision, or cannot fit"
      - kind: agent
        name: wtfp-prose-polisher
        description: Improve clarity, rhythm, concision, and authorial voice without
          changing technical meaning, evidence, citation placement, or
          argumentative direction. Polishing is a constrained transformation,
          not a substantive rewrite.
      - kind: agent
        name: wtfp-research-synthesizer
        description: Investigate the literature needed to plan and write a specific
          section well. The output is an evidence-traceable synthesis of
          foundational and recent work, standard approaches, genuine gaps,
          positioning options, and concrete writing guidance—not a search-r
      - kind: agent
        name: wtfp-section-planner
        description: "Convert one approved section goal into small, executable writing
          plans. A plan is a precise writing contract: it connects claims,
          evidence, word budgets, sequencing, author decisions, and measurable
          completion criteria without pre-writing the section."
      - kind: agent
        name: wtfp-section-reviewer
        description: Review a section as an academic evaluator and produce prioritized,
          actionable feedback. The invocation may select a review
          lens—adversarial peer, significance-focused chair, production editor,
          or constructive mentor—without changing the underlying evidence
      - kind: agent
