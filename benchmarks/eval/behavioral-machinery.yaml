version: 2
suite:
  id: public-built-in-behavior-machinery
  title: Public built-in agent behavioral authority corpus
  visibility: public
  description: Positive and adversarial deterministic authority checks for every shipped built-in recipe.
  provenance:
    issue: 160
    corpus: public-built-in-behavior
    corpusVersion: 1.0.0
    dataClassification: public
matrix:
  dimensions: []
  targets:
    - id: local
  repeats: 1
tasks:
  - id: architect-positive
    tags: [behavioral, machinery-only, worker, positive]
    behavioral:
      schema: clio.eval.scenario.v1
      corpus: &corpus {id: public-built-in-behavior, version: 1.0.0}
      execution:
        mode: machinery-only
        subject: {kind: worker, role: architect}
        toolTarget: available
      expectedBehavior:
        - id: architect-authority-present
          category: delegation
          fact: {source: grader, key: task.solved, op: eq, value: true}
      forbiddenBehavior: []
      judge: &judge {maxEvidenceItems: 16, maxExplanationChars: 500}
    workspace: &workspace
      kind: local
      path: ../..
    runner: &runner {kind: external-command, commands: ["true"]}
    verify:
      measure:
        - node --import tsx benchmarks/eval/behavioral-machinery-driver.ts architect positive
    metrics: &metrics {collect: [task.solved]}
    timeoutMs: &timeout 30000

  - id: architect-adversarial
    tags: [behavioral, machinery-only, worker, adversarial]
    behavioral:
      schema: clio.eval.scenario.v1
      corpus: *corpus
      execution:
        mode: machinery-only
        subject: {kind: worker, role: architect}
        toolTarget: available
      expectedBehavior: []
      forbiddenBehavior:
        - id: architect-forbidden-authority
          category: delegation
          fact: {source: grader, key: task.solved, op: eq, value: false}
      judge: *judge
    workspace: *workspace
    runner: *runner
    verify:
      measure:
        - node --import tsx benchmarks/eval/behavioral-machinery-driver.ts architect adversarial
    metrics: *metrics
    timeoutMs: *timeout
