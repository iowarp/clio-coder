version: 2
suite:
  id: clio-soak
  title: Clio soak — the machinery under load
  visibility: local
  description: >-
    Every other benchmark measures the model and only incidentally touches
    Clio. This one inverts that. A weak model that never repairs the fixture
    passes, because the machinery behaved; a strong model that repairs it fails
    the moment Clio does not seal a receipt, cannot authenticate one it sealed,
    or reports an outcome its own exit status contradicts.

    The two readings stay apart. `verify.measure` records whether the model
    solved the task and gates nothing. `thresholds.fail` carries the invariants,
    and an invariant a run could not measure fails the gate closed.
  provenance:
    fixtures: benchmarks/soak/fixtures
    offline: true

matrix:
  targets:
    - id: mini
      model: KAT-Coder-V2.5-Dev-IQ4_NL
  repeats: 1

tasks:
  # The same workload through the two surfaces that run it: the headless main
  # agent, and a dispatched worker. Comparing them is the point — a promise
  # kept on one surface and broken on the other is exactly what a soak is for.
  - id: single-file-bug.main-agent
    tags: [offline, invariant, main-agent]
    workspace:
      kind: temp-copy
      path: fixtures/single-file-bug
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: clio-run
      prompt: >-
        rollingMean in src/window.mjs drops the final complete window. Fix it so
        `node test/known-answers.test.mjs` passes. Change only src/window.mjs.
      timeoutMs: 600000
    verify:
      measure:
        - node test/known-answers.test.mjs
    metrics:
      collect:
        - receipt.sealed
        - receipt.integrityValid
        - receipt.outcomeMatchesExit
        - task.solved
        - patch.filesChanged
        - patch.testFilesModified
        - tokens.measured
    timeoutMs: 660000

  - id: single-file-bug.dispatch
    tags: [offline, invariant, dispatch]
    workspace:
      kind: temp-copy
      path: fixtures/single-file-bug
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: clio-run
      agent: coder
      prompt: >-
        rollingMean in src/window.mjs drops the final complete window. Fix it so
        `node test/known-answers.test.mjs` passes. Change only src/window.mjs.
      timeoutMs: 600000
    verify:
      measure:
        - node test/known-answers.test.mjs
    metrics:
      collect:
        - receipt.sealed
        - receipt.integrityValid
        - receipt.outcomeMatchesExit
        - task.solved
        - patch.filesChanged
        - patch.testFilesModified
        - tokens.measured
    timeoutMs: 660000

# The gate. Every entry is a condition under which Clio broke a promise, and a
# metric a run could not produce fails here too, so a check that never ran can
# never read as compliance.
thresholds:
  fail:
    # Every headless run seals a receipt, the interrupted ones included.
    - metric: receipt.sealed
      op: eq
      value: false
    # A sealed receipt authenticates against the ledger envelope it names.
    - metric: receipt.integrityValid
      op: eq
      value: false
    # No receipt claims an outcome its own exit code or its process contradicts.
    - metric: receipt.outcomeMatchesExit
      op: eq
      value: false
    # One operator-initiated run per item, so a leaked or duplicated root run
    # shows up as a count rather than as silence.
    - metric: receipt.rootCount
      op: neq
      value: 1
    # A run that reached a provider reports what it spent. Accounting that
    # observed nothing is unmeasured, and unmeasured is not free.
    - metric: tokens.measured
      op: eq
      value: false
