version: 2
suite:
  id: clio-soak
  title: Clio soak — the machinery under load
  visibility: local
  description: >-
    Every other benchmark measures the model and only incidentally touches
    Clio. This one inverts that. A weak model that never repairs the fixture
    passes, because the machinery behaved; a strong model that repairs it fails
    the moment Clio does not seal a receipt, cannot authenticate one it sealed,
    or reports an outcome its own exit status contradicts.

    The readings stay in three layers. `verify.measure` records whether the
    model solved the task and gates nothing. `thresholds.fail` carries the
    invariants every surface answers. A task's own `verify.assertions` carry the
    invariants only its surface can answer: a worker attests processes that the
    main agent never has, while the main agent persists a session ledger that a
    dispatched worker currently does not. An invariant a run could not measure
    fails closed in either layer.
  provenance:
    fixtures: benchmarks/soak/fixtures
    offline: true

matrix:
  targets:
    - id: mini
      model: KAT-Coder-V2.5-Dev-IQ4_NL
  repeats: 1

tasks:
  # The same workload through the two surfaces that run it: the headless main
  # agent, and a dispatched worker. Comparing them is the point — a promise
  # kept on one surface and broken on the other is exactly what a soak is for.
  - id: single-file-bug.main-agent
    tags: [offline, invariant, main-agent]
    workspace:
      kind: temp-copy
      path: fixtures/single-file-bug
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: clio-run
      prompt: >-
        rollingMean in src/window.mjs drops the final complete window. Fix it so
        `node test/known-answers.test.mjs` passes. Change only src/window.mjs.
      timeoutMs: 600000
    verify:
      measure:
        - node test/known-answers.test.mjs
      assertions:
        # The main-agent surface persists a replayable session transcript. The
        # dispatch worker currently streams its transcript but writes no session,
        # so these promises belong here rather than in the suite-wide gate.
        - metric: ledger.formatVersion
          op: eq
          value: 3
        - metric: ledger.toolPairsUnmatched
          op: eq
          value: 0
        - metric: ledger.assistantBetweenCallAndResult
          op: eq
          value: 0
        - metric: receipt.rootCount
          op: eq
          value: 1
    metrics:
      collect:
        - receipt.sealed
        - receipt.integrityValid
        - receipt.outcomeMatchesExit
        - ledger.formatVersion
        - ledger.toolPairsUnmatched
        - ledger.assistantBetweenCallAndResult
        - ledger.sessionCount
        - task.solved
        - patch.filesChanged
        - patch.testFilesModified
        - tokens.measured
        - stream.messageUpdateCount
        - stream.cumulativeSnapshots
        - stream.segmentUsageMatchesMessages
    timeoutMs: 660000

  - id: single-file-bug.dispatch
    tags: [offline, invariant, dispatch]
    workspace:
      kind: temp-copy
      path: fixtures/single-file-bug
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: clio-run
      agent: coder
      prompt: >-
        rollingMean in src/window.mjs drops the final complete window. Fix it so
        `node test/known-answers.test.mjs` passes. Change only src/window.mjs.
      timeoutMs: 600000
    verify:
      measure:
        - node test/known-answers.test.mjs
      assertions:
        # A worker leads its own process group and abort escalates against the
        # whole group, so nothing it attested may outlive the run. Only the
        # dispatch surface can answer this: the main agent attests no worker.
        - metric: process.orphanedChildren
          op: eq
          value: 0
        - metric: receipt.rootCount
          op: eq
          value: 1
    metrics:
      collect:
        - receipt.sealed
        - receipt.integrityValid
        - receipt.outcomeMatchesExit
        - task.solved
        - patch.filesChanged
        - patch.testFilesModified
        - tokens.measured
        - process.attestedWorkers
        - process.orphanedChildren
        - stream.messageUpdateCount
        - stream.cumulativeSnapshots
        - stream.segmentUsageMatchesMessages
    timeoutMs: 660000

  - id: compaction-continuity.main-agent
    tags: [offline, invariant, main-agent, continuity]
    workspace:
      kind: temp-copy
      path: fixtures/compaction-continuity
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: external-command
      commands:
        - >-
          node "$CLIO_ENTRY" run --target mini --json "Use the read tool to read planted-fact.txt. Do not modify any file."
        - >-
          node "$CLIO_ENTRY" run --target mini --continue --json "Append one short continuity checkpoint. Do not modify any file."
        - >-
          CLIO_FORCE_COMPACT=1 node "$CLIO_ENTRY" run --target mini --continue --json "After compaction, use the read tool to read planted-fact.txt again. Do not modify any file."
      timeoutMs: 600000
    verify:
      measure:
        - node test/known-answers.test.mjs
      assertions:
        - metric: continuity.compactionSummaryPresent
          op: eq
          value: true
        - metric: continuity.answeredFromPreCompaction
          op: eq
          value: true
        - metric: receipt.rootCount
          op: eq
          value: 3
    metrics:
      collect:
        - receipt.sealed
        - receipt.integrityValid
        - receipt.outcomeMatchesExit
        - receipt.rootCount
        - ledger.formatVersion
        - ledger.toolPairsUnmatched
        - ledger.assistantBetweenCallAndResult
        - ledger.sessionCount
        - continuity.compactionSummaryPresent
        - continuity.answeredFromPreCompaction
        - continuity.turnsAfterCompaction
        - tokens.measured
        - stream.messageUpdateCount
        - stream.cumulativeSnapshots
        - stream.segmentUsageMatchesMessages
        - task.solved
        - patch.filesChanged
        - patch.testFilesModified
    timeoutMs: 1860000

# The gate. Every entry is a condition under which Clio broke a promise, and a
# metric a run could not produce fails here too, so a check that never ran can
# never read as compliance.
thresholds:
  fail:
    # Every headless run seals a receipt, the interrupted ones included.
    - metric: receipt.sealed
      op: eq
      value: false
    # A sealed receipt authenticates against the ledger envelope it names.
    - metric: receipt.integrityValid
      op: eq
      value: false
    # No receipt claims an outcome its own exit code or its process contradicts.
    - metric: receipt.outcomeMatchesExit
      op: eq
      value: false
    # A run that reached a provider reports what it spent. Accounting that
    # observed nothing is unmeasured, and unmeasured is not free.
    - metric: tokens.measured
      op: eq
      value: false
    # Content crosses the wire once, as an increment while it streams and as one
    # completed message when it lands. A republished partial message or a
    # republished segment transcript is that promise broken, on either surface.
    - metric: stream.cumulativeSnapshots
      op: gt
      value: 0
    # One provider response is one completed assistant message. Reporting it
    # twice makes a run read as costlier than it was.
    - metric: stream.usageDoubleCounted
      op: eq
      value: true
    # The per-message and per-segment accounts of the same run agree. Two
    # independent views disagreeing means one is wrong about what it cost.
    - metric: stream.segmentUsageMatchesMessages
      op: eq
      value: false
