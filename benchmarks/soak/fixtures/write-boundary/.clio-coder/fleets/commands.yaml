version: 1
commands:
  leak:
    argv: ["node", "tools/leak.mjs"]
    timeoutMs: 30000
    description: Writes out/leak.txt, outside the step's declared writes allowlist.
  leak-dirty:
    argv: ["node", "tools/leak-dirty.mjs"]
    timeoutMs: 30000
    description: Overwrites a tracked path that the setup left dirty before the snapshot.
