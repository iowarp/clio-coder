version: 2
suite:
  id: clio-soak-boundary
  title: Clio soak — per-step write boundaries
  visibility: local
  description: >-
    A step that escapes its declared `writes` allowlist, made deterministic by a
    registry command rather than by talking a model into misbehaving. No model
    participates, so nothing here can pass or fail on model quality.

    Enforcement is detect-and-rollback, never sandboxing, and this suite gates
    exactly that promise: Clio saw the write, named it
    `writes_boundary_violation`, restored what git could restore, and sealed a
    verdict carrying its own digest and the baseline commit it measured
    against.

    Two items, because the two endings are different promises. The recoverable
    one is `rolled-back` with the path gone. The honest failure is
    `rollback-incomplete`: a path already dirty at the snapshot has its prior
    bytes nowhere but the tree the step overwrote, so the tree is left exactly
    as the step made it and the reason is recorded. A rollback that guessed at
    content it never recorded would destroy work, and reporting that guess as a
    clean rollback would be worse.

    This suite carries no `thresholds.fail`. Its items run no model, seal no
    agent receipt, and observe no provider usage, so the suite-wide invariants
    in `clio-soak.yaml` have nothing to read here. Each item gates on the
    invariants its own surface can answer.
  provenance:
    fixtures: benchmarks/soak/fixtures
    offline: true

matrix:
  targets:
    - id: mini
  repeats: 1

tasks:
  - id: write-boundary.rolled-back
    tags: [offline, invariant, boundary]
    workspace:
      kind: temp-copy
      path: fixtures/write-boundary
      setup:
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
    runner:
      kind: external-command
      commands:
        # The step must fail. An enforcement that lets the violating step exit
        # zero has not enforced anything, so a zero exit here is the failure.
        - >-
          node "$CLIO_CODER_ENTRY" fleet run boundary-leak --json; test $? -ne 0
      timeoutMs: 120000
    verify:
      # The metrics read the sealed verdict; this reads the tree that verdict
      # claims to describe. A verdict saying `rolled-back` beside a file still
      # on disk fails here.
      commands:
        - node test/known-answers.test.mjs rolled-back
      assertions:
        - metric: boundary.verdictCount
          op: eq
          value: 1
        - metric: boundary.verdictSealed
          op: eq
          value: true
        - metric: boundary.violationsDetected
          op: eq
          value: 1
        - metric: boundary.violationsRolledBack
          op: eq
          value: 1
        - metric: boundary.rollbackIncomplete
          op: eq
          value: 0
    metrics:
      collect:
        - boundary.verdictCount
        - boundary.verdictSealed
        - boundary.violationsDetected
        - boundary.violationsRolledBack
        - boundary.rollbackIncomplete
        - patch.filesChanged
        - patch.testFilesModified
    timeoutMs: 180000

  - id: write-boundary.rollback-incomplete
    tags: [offline, invariant, boundary]
    workspace:
      kind: temp-copy
      path: fixtures/write-boundary
      setup:
        - mkdir -p out
        - printf 'baseline content\n' > out/preexisting.txt
        - git init -q -b main .
        - git -c user.email=soak@clio.local -c user.name=Soak add -A
        - git -c user.email=soak@clio.local -c user.name=Soak commit -q -m 'fixture baseline'
        # Dirty before the snapshot. This is what makes the prior bytes
        # unrecorded anywhere git can reach.
        - printf 'dirty before the snapshot\n' > out/preexisting.txt
    runner:
      kind: external-command
      commands:
        - >-
          node "$CLIO_CODER_ENTRY" fleet run boundary-dirty --json; test $? -ne 0
      timeoutMs: 120000
    verify:
      commands:
        - node test/known-answers.test.mjs rollback-incomplete
      assertions:
        - metric: boundary.verdictCount
          op: eq
          value: 1
        - metric: boundary.verdictSealed
          op: eq
          value: true
        - metric: boundary.violationsDetected
          op: eq
          value: 1
        - metric: boundary.rollbackIncomplete
          op: eq
          value: 1
        # Nothing was restored. Reporting a rollback that did not happen would
        # be the failure this names.
        - metric: boundary.violationsRolledBack
          op: eq
          value: 0
    metrics:
      collect:
        - boundary.verdictCount
        - boundary.verdictSealed
        - boundary.violationsDetected
        - boundary.violationsRolledBack
        - boundary.rollbackIncomplete
        - patch.filesChanged
        - patch.testFilesModified
    timeoutMs: 180000
