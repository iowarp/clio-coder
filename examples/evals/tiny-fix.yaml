version: 2
suite:
  id: tiny-fix
  title: Tiny fix
  visibility: public
  description: Model-required fixture for a small code repair task.
  provenance:
    source: public example
matrix:
  targets:
    - id: local
  repeats: 1
tasks:
  - id: repair-add
    tags:
      - model-required
    workspace:
      kind: temp-copy
      path: fixtures/tiny-fix
      excludes:
        - node_modules
    runner:
      kind: clio-run
      prompt: Fix the add function so node test.js passes.
    verify:
      commands:
        - node test.js
    metrics:
      collect:
        - tokens.total
        - latency.wallMs
        - patch.filesChanged
        - verifier.exitCode
    timeoutMs: 120000
thresholds:
  fail:
    - metric: result.pass
      op: eq
      value: false
