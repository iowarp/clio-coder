version: 2
suite:
  id: context-determinism
  title: Context determinism
  visibility: public
  description: Offline context index determinism check for the current checkout.
  provenance:
    source: public example
matrix:
  targets:
    - id: local
  repeats: 1
tasks:
  - id: context-index-current
    tags:
      - offline
      - deterministic
    workspace:
      kind: local
      path: ../..
    runner:
      kind: context-index
    verify:
      assertions:
        - metric: context.indexedFiles
          op: gt
          value: 0
        - metric: context.coverage
          op: gt
          value: 0
    metrics:
      collect:
        - context.indexedFiles
        - context.coverage
        - context.structuralHash
        - context.digestTokens
    timeoutMs: 120000
thresholds:
  fail:
    - metric: result.pass
      op: eq
      value: false
