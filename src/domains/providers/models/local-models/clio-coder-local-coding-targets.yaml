  matchPatterns:
    - ornith-1.5-35b-a3b
    - ornith1.5-35b-moe
    - ornith-1.5-35b
    - ornith1.5-35b
    - ornith-1.5
    - ornith1.5
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: false
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 262144
    maxTokens: 65536
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD GPU on the Vulkan backend, 4 request slots"
      runtime: llamacpp
      build: b1-c841aee
      model: "Ornith-1.5-35B-A3B Q4_K_M (arch qwen35moe)"
      llamaCpp: >-
        --ctx-size 786432 --parallel 4 --no-kv-unified --cache-type-k q8_0
        --cache-type-v q8_0 --batch-size 16384 --ubatch-size 2048 --jinja
        --reasoning on
      date: "2026-09-02"
      source: "prompt-infrastructure round 2 (v0.4.2 development): live probe of the on-off switch, and a debugger dispatch receipt"
      note: |
        The 1.5 release is a Qwen3.5-MoE derivative and its chat template
        honors enable_thinking, which the 1.0 measurement above did not find.
        Measured on this date: with chat_template_kwargs.enable_thinking false
        the model answered a one-line arithmetic prompt in 4 completion tokens
        with no reasoning_content; with it true the same prompt spent 79
