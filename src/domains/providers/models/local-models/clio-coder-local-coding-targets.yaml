- family: qwopus3.6-35b-a3b-coder
  matchPatterns:
    - qwopus3.6-35b-a3b-coder-mtp-q4_k_m-262k
    - qwopus3.6-35b-a3b-coder-mtp
    - qwopus3.6-35b-a3b-coder
    - qwopus3.6-35b-a3b
    # The mini router's short id for this same gguf. At 17 characters it outbids
    # the 13-character `qwopus3.6-27b` of the preview family, whichever order
    # the two entries load in.
    - qwopus3.6-35b-moe
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    # Reasoning class: on-off, and which field carries the switch depends on the
    # runtime. The card frames the Coder-MTP line as thinking-off execution, but
    # the wire disagrees on both hosts measured: the model reasons unless it is
    # told not to, or stays silent unless it is told to, and never ignores the
    # control that runtime honors.
    #
    # llama.cpp, 2026-09-02: chat_template_kwargs.enable_thinking is the switch.
    # true took a one-line arithmetic prompt from 3 completion tokens to 130
    # with 338 characters of reasoning_content, while reasoning_effort none, low
    # and high all left it at 3 tokens with no trace.
    #
    # LM Studio, 2026-08-08: exactly the reverse. enable_thinking was inert
    # (verified with unique prompts to rule out cache hits) and reasoning_effort
    # "none" was the control that worked, taking a prompt from 98 reasoning
    # tokens to 0. Clio's on-off mechanism sends the template flag on every
    # runtime and adds LM Studio's reasoning_effort spelling on that one, so
    # both surfaces get a dial that reaches the model.
    #
    # reasoning=false previously resolved to mechanism "none", and mechanism
    # "none" makes openai-completions strip reasoning_effort from the payload.
    # The flag set to suppress thinking was the reason it could not be
    # suppressed.
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: true
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 262144
    maxTokens: 32768
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD Radeon AI PRO R9700 32 GB, Vulkan backend, 4 request slots, for the 2026-09-02 run; unknown for both earlier dates"
      runtime: "llamacpp for the 2026-09-02 on-off measurement; lmstudio and its OpenAI-compatible port for the 2026-08-08 reasoning findings; an unrecorded llama.cpp host for the presence-penalty finding"
      build: "worker llama-server from /home/akougkas/src/llama.cpp-b10687/build-vulkan/bin behind a router reporting build_info b1-c841aee, for the 2026-09-02 run. Unknown for both earlier dates; the Windows LM Studio measurement host's bundled build string was first recorded on 2026-08-29 as llama.cpp-win-x86_64-nvidia-cuda12-avx2, which is three weeks after the reasoning measurement and cannot be backdated to it"
      model: "Qwopus3.6-35B-A3B-Coder-MTP Q4_K_M (arch qwen35moe)"
      llamaCpp: >-
        2026-09-02 only: --ctx-size 786432 --parallel 4 --no-kv-unified
        --cache-type-k q8_0 --cache-type-v q8_0 --batch-size 16384 --ubatch-size
        2048 --flash-attn true --fit off --n-gpu-layers 99 --jinja --reasoning
        off --chat-template-kwargs {"enable_thinking": false} --temperature 0.6
        --top-k 20 --top-p 0.95 --min-p 0.0 --presence-penalty 0.0
        --repeat-last-n 256 --repeat-penalty 1.0. Unknown for both earlier
        dates; the reasoning measurement went through LM Studio's HTTP port,
        which does not expose the underlying server argv, and no argv survives
        for the dispatch that produced the presence-penalty value
      date: "2026-09-02 (llama.cpp on-off switch), 2026-08-08 (reasoning_effort and enable_thinking on LM Studio), 2026-07-06 (presence penalty)"
      source: "issue #263 thinking sweep for the llama.cpp date; commits b3db3b82 and f7d76bf4 for the two earlier ones"
      note: |
        Measured 2026-09-02 on llama.cpp: with no thinking field, and with
        chat_template_kwargs.enable_thinking false, the model answered a
        one-line arithmetic prompt in 3 completion tokens with no
        reasoning_content; with enable_thinking true the same prompt spent 130
        tokens, 338 characters of them reasoning. reasoning_effort none, low and
        high all left it at 3 tokens with no trace. The silent baseline is the
        router's doing rather than the checkpoint's: the preset launches this
        model with --reasoning off and chat_template_kwargs enable_thinking
        false, which is the opposite default from the LM Studio host below.

        Three numbers from the earlier dates are also measurements. On
        2026-08-08 on that LM Studio host this model spent 98 of 103 completion
        tokens reasoning on "what is 17+25" with no thinking field set;
        chat_template_kwargs enable_thinking was inert, re-checked with unique
        prompts to rule out prompt-cache hits; and reasoning_effort "none" took
        the same prompt to 0. The same session recorded a wiki planning dispatch
        over a 1007-file repository going from 89,501 reasoning tokens, 47 tool
        calls and exit 1 at 459 s to 0 reasoning tokens, 8 tool calls and exit 0
        at 218 s. On 2026-07-06 a live dispatch measured presence_penalty 1.5:
        without it a coder worker repeated one code_nav call into the loop-guard
        abort on 3 of 3 runs, and with it the same task passed 3 of 3. Neither
        commit records the hardware or the server configuration, so both stay
        unknown.

        The 2026-09-02 server also differs from the profile recommended below.
        It ran ctx-size 786432 with --parallel 4 and --no-kv-unified, giving each
        slot 196608 tokens, and served text-only with no mmproj and no MTP draft
        where the block below recommends 262144 at parallel 1 with both active.
        The vision capability stays the checkpoint's; that run simply did not
        load the projector. That has a consequence for any projector-less
        deployment, because the model Clio builds takes vision from this entry
        and from a target-level override only: synthLocalModel merges the
        runtime defaults, this entry and target.capabilities and passes no probe
        layer, then sets input to ["text","image"] whenever vision is true. Once
        this id resolves here rather than to the 27B preview it did before issue
        #263, mini's text-only preset would be offered image input it rejects,
        so a target serving this checkpoint without --mmproj needs
        capabilities.vision false on the target entry.

        Why on-off replaced the four-level effort map, and what it costs. The
        map gave LM Studio a low/medium/high granularity nothing had measured,
        and gave llama.cpp an active level that put reasoning_effort on the wire
        and nothing else, which this template does not read. on-off is what both
        measurements support. The cost is that resolveRequestCapability adds the
        reasoning_effort spelling for an on-off family only when runtimeId is
        literally `lmstudio` (REASONING_EFFORT_ONLY_RUNTIMES), while an
        effort-levels family emitted it on every runtime. An LM Studio server
        reached through a generic openai-compat, litellm or vllm target
        therefore now receives only the template flag, which that host ignores,
        and the model reasons at every level. Point such a target at the
        `lmstudio` runtime, which is what the 2026-08-08 finding above was taken
        on and what carries the spelling that reaches it.
    sampling:
      instruct:
        temperature: 0.2
        topP: 0.9
        topK: 20
        repeatPenalty: 1.05
        # Upstream Qwen3.6 card recommends presence_penalty 1.5 for
        # non-thinking modes to suppress repetition loops. Measured on live
        # dispatch (2026-07-06): without it a coder worker repeated one
        # code_nav call into the loop-guard abort on 3 of 3 runs; with it the
        # same task passed 3 of 3 with clean edit-then-validate trajectories.
        presencePenalty: 1.5
    gpuTiers:
      "32gb": "Default 32 GB local profile: Q4_K_M, ctx=262144, q8 KV, flash attention, parallel=1, with F32 mmproj (vision) and draft-mtp speculative decoding both active. Leaves several GiB free at 262k on a 32 GiB class card."
    runtimePreference:
      llamaCpp: "OpenAI-compatible chat completions with --jinja. Recommended local profile serves text-only with reasoning off and enable_thinking false; coder sampler temperature 0.2, top_p 0.9, top_k 20."
      openaiCompat: "Use when a gateway fronts the same llama.cpp chat-completions surface with qwen tool parsing."
    llamaCpp:
      ctxSize: 262144
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      parallel: 1
      parallelSlots: "Start the server with --parallel 1 so one agent gets the whole 262144-token context. Clio discovers total_slots 1 and admits one request at a time on this endpoint. This family is often the workers.default model on a router that also serves the orchestrator, and a one-slot router refuses the worker batch rather than queueing it; a second server or an explicit maxConcurrentRequests on the target is the remedy."
      batchSize: 2048
      ubatchSize: 512
      mmproj: true
      chatTemplateKwargs:
        enable_thinking: false
    thinking:
      mechanism: on-off
      guidance: |
        One switch, two spellings: chat_template_kwargs.enable_thinking on
        llama.cpp, reasoning_effort ("none" off, "low" on) on LM Studio, each
        inert on the other host. Intermediate levels coerce to on, and off has
        to be carried on the wire because the checkpoint reasons unless told
        not to, whatever its card says about thinking-off execution.
    serving: "Jackrong Qwopus3.6 35B-A3B Coder MTP, Q4_K_M. Thinking-off coder/agent tuned for tool-use loops. Served as a local router default with MTP speculative decoding (spec-type draft-mtp, n_max 2) and F32 mmproj vision both active at 262k."

