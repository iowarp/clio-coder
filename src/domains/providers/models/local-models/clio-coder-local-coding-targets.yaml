  # families that keep only their full spellings. An unlisted `qwopus3.6-*` id
  # now matches nothing, and a model with no family gets whatever
  # `inferThinkingMechanism` reads off the live probe: `none` with the dial
  # pinned to off and every thinking field stripped when the server reports no
  # reasoning, `on-off` when it reports some. Both are honest about knowing
  # nothing. Inheriting a sibling's measured dial is not, and it is the failure
  # mode that costs a session its reasoning silently. Adding the id is a
