# https://huggingface.co/Qwen/Qwen3.6-35B-A3B
# https://huggingface.co/Qwen/Qwen3.6-27B
# https://huggingface.co/Qwen/Qwen3.8-27B
# https://huggingface.co/google/gemma-4-26B-A4B
# https://huggingface.co/LilaRest/gemma-4-31B-it-NVFP4-turbo
# https://huggingface.co/Jackrong/Gemopus-4-31B-it-GGUF
# https://huggingface.co/Jackrong/Qwopus3.6-27B-v1-preview-GGUF
# https://huggingface.co/Jackrong/Qwopus3.6-35B-A3B-Coder-MTP-GGUF
# https://huggingface.co/nvidia/Nemotron-Cascade-2-30B-A3B
# https://huggingface.co/unsloth/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-GGUF
# https://huggingface.co/mradermacher/Qwen3.5-35B-A3B-Claude-4.6-Opus-Reasoning-Distilled-i1-GGUF
# https://huggingface.co/deepreinforce-ai/Ornith-1.0-35B-GGUF
#
# This knowledge base is intentionally narrow. It describes only the local
# models curated for Clio's local coding workflows and leaves cloud GPT models
# to pi-ai's native OpenAI and openai-codex catalogs.
#
# Serving configuration is a quality variable, not a constant. Context length,
# KV quantization, batch and ubatch size, speculative decoding, and the server's
# own sampler defaults all move what a model does, so a quirk measured under one
# configuration is not a property of the weights. Every family entry whose
# quirks came from a measurement rather than from the model card carries a
# `measuredUnder` block naming the hardware class, the runtime and its build
# string, and the llama.cpp flags the measurement ran under. Fields that could
# not be established from git history or the release-test reports under
# docs/release-notes/ read `unknown` rather than a plausible guess. A
# `measuredUnder` block is provenance for a reader; nothing in the engine
# consumes it (`extractLocalModelQuirks` narrows only sampling and thinking).
#
# `llamaCpp.parallel` is the recommended `--parallel` value for starting the
# server, and families that carry one also carry a `parallelSlots` note. It is
# not what dispatch admission counts. Endpoint capacity resolves a target's
# request-slot limit in this order: an explicit `maxConcurrentRequests` on the
# target, then `parallelSlots` discovered from the server (llama.cpp reads
# `total_slots` from `/props`, falling back to the selected worker's
# `/props?model=<id>` and then to its `--parallel` argv), then one slot for any
# other local-native runtime. vLLM and SGLang stay unbounded without an explicit
# override. The catalog value therefore says what to start the server with; the
# server's own answer is what Clio admits against.
#
# Thinking semantics for these local families: the chain-of-thought is emitted
# by the model's chat template (Qwen-style <think> blocks, Gemma 4 thinking
# template, Nemotron reasoning template). LM Studio's OpenAI-compatible HTTP
# surface uses reasoning_effort as its sole thinking control; llama.cpp support
# depends on the active template and reasoning parser. If a model emits thought
# despite the requested level, Clio captures it in a ThinkingContent block,
# counts it separately on receipts and the TUI footer, and surfaces it rather
# than hiding what the server returned.
- family: openai-gpt-oss
  matchPatterns:
    - openai/gpt-oss
    - gpt-oss
    - gpt-oss-20b
    - gpt-oss-120b
  capabilities:
    chat: true
    tools: true
    toolCallFormat: openai
    reasoning: true
    thinkingFormat: harmony
    structuredOutputs: json-schema
    vision: false
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 131072
    maxTokens: 32768
  quirks:
    sampling:
      thinking:
        temperature: 1
        topP: 1
      instruct:
        temperature: 1
        topP: 1
    runtimePreference:
      llamaCpp: "Use the OpenAI-compatible chat-completions surface with chat_template_kwargs.reasoning_effort set to low, medium, or high."
      openaiCompat: "Preferred for Harmony reasoning-effort control when the local gateway exposes chat_template_kwargs."
    thinking:
      mechanism: effort-levels
      effortByLevel:
        low: low
        medium: medium
        high: high
      guidance: |
        GPT-OSS uses OpenAI Harmony formatting and supports low, medium, and
        high reasoning effort. Clio coerces off/minimal to low, captures
        non-final Harmony channels as ThinkingContent, and strips Harmony
        control tokens from visible output.

