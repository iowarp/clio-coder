        topP: 0.9
        topK: 20
      thinking:
        temperature: 0.6
        topP: 0.95
        topK: 20
        reasoningBudget: 2048
    gpuTiers:
      "16gb": "Use this as the local 16GB emulation target. It keeps the output cap below the 32GB-class MoE defaults."
    runtimePreference:
      lmstudio: "Primary local laptop path. Verified through LM Studio /api/v1/models with 262144 loaded context, flash attention, GPU KV offload, and trained_for_tool_use."
      openaiCompat: "LM Studio chat uses this surface for reasoning and tool calls."
      anthropicCompat: "LM Studio's Anthropic Messages surface streams simple text with the server root URL as baseUrl; keep as a protocol fallback until tool and reasoning behavior are proven."
    thinking:
      # Measured 2026-08-11 against LM Studio on this exact model: baseline 56
      # reasoning tokens, reasoning_effort none 120, reasoning_effort minimal
      # 243, chat_template_kwargs.enable_thinking false 45, both together 44.
      # No spelling silences it, and the budget-tokens mechanism it used to
      # claim is informational on both LM Studio and llama.cpp, so nothing ever
      # reached the wire. Always-on is what the model actually does.
      mechanism: always-on
      guidance: |
        Qwopus 9B distilled from Opus reasoning; the chain-of-thought comes out
        of the chat template unconditionally and the dial cannot stop it, so
        Clio shows the level as forced. Output cap is tighter than the
        32GB-class MoE families because this is the 16GB emulation target;
        budget for a reasoning preamble ahead of every answer.
    serving: "LM Studio reports trained_for_tool_use for the local qwopus3.5-9b-v3 target. Configure residency through LM Studio or explicit lmstudio.load settings."

# Meta's Muse Glimmer is a new vendor, architecture and template for this
# catalog: no existing family shares its perception encoder, its DFlash drafter,
# or its reasoning control. It is listed under always-on because its dial is not
# representable, not because the model reasons unconditionally by design; the
# measuredUnder note below records what was tried.
- family: muse-glimmer-30b
  matchPatterns:
    # No bare `muse-glimmer`: it would swallow a future Muse Glimmer of another
    # size, which shares neither this 131072 window nor a measured dial.
    - unsloth/muse-glimmer-30b-gguf
    - muse-glimmer-30b
    # The mini router serves the same weights under both this short id and the
    # unsloth repo name above.
    - muse-30b-dense
  capabilities:
    chat: true
    tools: true
    toolCallFormat: openai
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: true
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 131072
    maxTokens: 32768
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD Radeon AI PRO R9700 32 GB, ROCm backend, 1 request slot"
      runtime: llamacpp
      build: "worker llama-server from /home/akougkas/src/llama.cpp-b10687/build-rocm/bin, behind a router reporting build_info b1-c841aee"
      model: "Muse-Glimmer-30B UD-Q4_K_XL with dflash-kquant draft and mmproj-Muse-Glimmer-30B-Q8_0 (arch muse-glimmer)"
      llamaCpp: >-
        --ctx-size 131072 --parallel 1 --kv-unified --cache-type-k q8_0
        --cache-type-v q8_0 --batch-size 2048 --ubatch-size 512 --flash-attn
        true --fit off --n-gpu-layers 99 --spec-type draft-dflash
        --spec-draft-n-max 16 --n-gpu-layers-draft 99 --jinja
        --chat-template-kwargs {"reasoning_strength": "xhigh"} --temperature 1.0
        --top-k 64 --top-p 0.95
      date: "2026-09-02"
      source: "issue #263 thinking sweep: one non-streaming POST /v1/chat/completions per variant on a one-line arithmetic prompt, max_tokens 4096"
      note: |
        always-on is the measured classification, and it is measured against
        both controls Clio can send. With no thinking field the model spent 99
        completion tokens with 358 characters of reasoning_content;
        chat_template_kwargs.enable_thinking false still produced 91 tokens with
        332 characters, and true produced 90 with 312; reasoning_effort none,
        low, and high produced 81, 83, and 61 tokens, every one of them with a
        trace. Nothing Clio can put on the wire silences it.

        The reason is the model's own design rather than a template bug. The
        card's dial is reasoning strength with levels low, medium, high, and
        xhigh, set through the system prompt as "Reasoning strength: <value>",
        and the router passes it as chat_template_kwargs.reasoning_strength
        pinned to xhigh. There is no off level on that scale, and no
        ThinkingMechanism in this engine emits that key:
        resolveRequestCapability populates chat_template_kwargs only with
        enable_thinking or, on the harmony path, reasoning_effort. Encoding this
        family as on-off would put a flag on the wire that this template does
        not read while the TUI showed a working off/on dial, which is the
        failure qwopus3.5-9b-v3 above was reclassified to stop. A real dial for
        this family needs a per-family kwarg key in the engine, not a catalog
        edit.

        Sampler provenance: temperature 1.0, top_p 0.95 and top_k 64 are the
        card's Best Practices values and the router preset uses the same three.
        The preset sets no repeat penalty and the card recommends none, so this
        entry declares none. contextWindow is the card's 131072, which the
        router matches at ctx-size 131072. maxTokens has no card value and
        follows the other 131072-context families here.
    sampling:
      thinking:
        temperature: 1.0
        topP: 0.95
        topK: 64
      instruct:
        temperature: 1.0
        topP: 0.95
        topK: 64
    gpuTiers:
      "32gb": "Agent-role target on a 32 GB card: UD-Q4_K_XL weights, q8_0 KV at ctx=131072, parallel=1, with the Q8_0 perception encoder and the DFlash drafter both resident."
    runtimePreference:
      llamaCpp: "OpenAI-compatible chat completions with --jinja. Set the reasoning budget at launch with --chat-template-kwargs {\"reasoning_strength\": \"...\"}; there is no per-request field Clio can send for it."
      openaiCompat: "Use when a gateway fronts the same llama.cpp chat-completions surface. Expect a reasoning trace on every response whatever the configured thinking level says."
    llamaCpp:
      ctxSize: 131072
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      parallel: 1
      parallelSlots: "Start the server with --parallel 1 so one agent gets the whole 131072-token context. Clio discovers total_slots 1 and admits one request at a time on this endpoint, so a dispatch raised while the orchestrator streams is refused rather than queued."
      batchSize: 2048
      ubatchSize: 512
      mmproj: true
      specType: draft-dflash
      specDraftNMax: 16
    thinking:
      mechanism: always-on
      chatTemplateKwargs:
        byLevel:
          # Card: reasoning strength low|medium|high|xhigh (scratchpad/catalog/models/unsloth-Muse-Glimmer-30B.md:35). The per-family kwarg key the note above asked for.
          key: reasoning_strength
          values:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
          lmstudio: unsupported
        lmstudio: unsupported
      guidance: |
        Muse Glimmer reasons on every turn and its strength scale has no off
        level, so Clio shows the dial as forced and budgets for a reasoning
        preamble ahead of every answer. Change the amount of thinking at the
        server, with the reasoning_strength chat-template kwarg; a per-request
        thinking level cannot reach this model.
    serving: "Meta Superintelligence Lab Muse-Glimmer-30B, a dense 29.6B causal transformer with a ~1.8B ViT-G/14 perception encoder, interleaved local and global attention with a 2048 sliding window, and a DFlash block-diffusion drafter that proposes 16 tokens per forward pass. Card context length is 131072. Input is text plus image; the mini router additionally tags video, which the card does not claim, so the catalog follows the card."

# ThinkingCap is a brevity finetune of Qwen3.6-27B and not the base model, so it
# keeps its own family rather than borrowing qwen3.6-27b's. No pattern here may
# be a bare `qwen3.6` spelling: `lookup` is a substring test, so `qwen3.6` alone
# would match every base-model id too and win or lose on length rather than on
# which checkpoint the id names. The `thinkingcap-` prefixed spellings below all
# contain `qwen3.6` harmlessly, because a longer pattern only matches ids that
# contain the whole longer string.
- family: thinkingcap-qwen3.6-27b
  matchPatterns:
    # No bare `thinkingcap`: it would swallow a ThinkingCap built on another
    # base, such as a Qwen3.8 32B, and hand it this q4's sampler, its 131072
    # window and a dial measured on a different checkpoint.
    - thinkingcap-qwen3.6-27b
    - thinkingcap-27b-dense-q4
    - thinkingcap-27b-dense
    - thinkingcap-27b
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: false
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 131072
    maxTokens: 32768
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD Radeon AI PRO R9700 32 GB, ROCm backend, 1 request slot"
      runtime: llamacpp
      build: "worker llama-server from /home/akougkas/src/llama.cpp-b10687/build-rocm/bin, behind a router reporting build_info b1-c841aee"
      model: "ThinkingCap-27B Q4_K_M with the MTP draft head baked into the gguf (arch qwen36)"
      llamaCpp: >-
        --ctx-size 131072 --parallel 1 --kv-unified --cache-type-k f16
        --cache-type-v f16 --batch-size 2048 --ubatch-size 512 --flash-attn true
        --fit off --n-gpu-layers 99 --spec-type draft-mtp --spec-draft-n-max 4
        --n-gpu-layers-draft 99 --jinja --reasoning on --chat-template-kwargs
        {"enable_thinking": true} --temperature 1.0 --top-k 20 --top-p 0.95
        --min-p 0.0 --repeat-penalty 1.0
      date: "2026-09-02"
      source: "issue #263 thinking sweep: one non-streaming POST /v1/chat/completions per variant on a one-line arithmetic prompt, max_tokens 4096"
      note: |
        The router tag is wrong for this model and the measurement wins. It is
        the only reasoning model on this router tagged reasoning:on rather than
        reasoning:on_off, and it carries no default_reasoning tag at all, which
        reads as always-on. It is not. On the q4 that this family is keyed to,
        the no-field baseline spent 125 completion tokens with 354 characters of
        reasoning_content, chat_template_kwargs.enable_thinking false answered
        in 3 tokens with none, and true spent 130 tokens with 388 characters.
        reasoning_effort is inert: none, low, and high produced 115, 140, and
        131 tokens with a trace every time. The default-on behavior comes from
        the preset rather than the checkpoint, because the
        [thinkingcap-27b-dense-q4] block launches the server with reasoning = on
        and chat-template-kwargs {"enable_thinking": true}.

        Issue #263 names thinkingcap-27b-dense-q6, which no longer exists. That
        quant was measured on this same date (baseline 99 tokens with 246
        characters of reasoning, enable_thinking false 3 tokens with none, true
        98 tokens with 291 characters, the same on-off shape as the q4) and then
        deleted from mini: the weights are gone and the preset block is removed
        from the router, which now serves the q4 as the only ThinkingCap id.
        This family therefore names no q6 quant. The short `thinkingcap-27b`
        pattern still covers that spelling if the operator ever restores it.

        One serving observation was taken on the q6 before it was removed and
        has not been repeated on the q4: in the round-5 cache sweep this model
        re-prefilled 661 tokens on a `--continue` turn where the other eight
        router models kept their prefix. Read it as a lead rather than a fact
        about the q4.

        Sampler provenance: temperature 0.6, top_p 0.95 and top_k 20 are the
        quantizer's stated intended sampling for this finetune, which also warns
        that greedy decoding makes it loop without closing the think block. The
        router preset instead runs temperature 1.0 with the same top_p and
        top_k, plus min_p 0.0 and repeat_penalty 1.0. The catalog follows the
        card, as it does for every other family here, and records the preset
        divergence above.
    sampling:
      thinking:
        temperature: 0.6
        topP: 0.95
        topK: 20
        minP: 0.0
        repeatPenalty: 1.0
      instruct:
        temperature: 0.6
        topP: 0.95
        topK: 20
        minP: 0.0
        repeatPenalty: 1.0
    gpuTiers:
      "32gb": "Reasoning-role target on a 32 GB card: Q4_K_M weights (about 17 GB) with f16 KV at ctx=131072, parallel=1, and the baked-in MTP draft head active."
    runtimePreference:
      llamaCpp: "OpenAI-compatible chat completions with --jinja and --reasoning on. The MTP head ships inside the gguf, so --spec-type draft-mtp needs no second model. Never decode greedy: temperature 0 makes this finetune loop without closing its think block."
      openaiCompat: "Use when a gateway fronts the same llama.cpp chat-completions surface with qwen reasoning and tool parsing."
    llamaCpp:
      ctxSize: 131072
      cacheTypeK: f16
      cacheTypeV: f16
      flashAttn: true
      nGpuLayers: 99
      parallel: 1
      parallelSlots: "Start the server with --parallel 1 so one agent gets the whole 131072-token context. Clio discovers total_slots 1 and admits one request at a time on this endpoint, so a dispatch raised while the orchestrator streams is refused rather than queued."
      batchSize: 2048
      ubatchSize: 512
      specType: draft-mtp
      specDraftNMax: 4
      chatTemplateKwargs:
        enable_thinking: true
    thinking:
      mechanism: on-off
      guidance: |
        ThinkingCap keeps the Qwen3.6 chat template's enable_thinking switch;
        intermediate levels coerce to on. The router serves it with thinking on
        by default, so off has to be carried on the wire rather than omitted,
        and reasoning_effort is inert on llama.cpp. The finetune's point is a
        shorter chain rather than no chain, so an active level is cheap.
    serving: "BottleCapAI ThinkingCap-Qwen3.6-27B, a brevity finetune of Qwen3.6-27B that holds accuracy at roughly 40 to 46 percent fewer thinking tokens (the quantizer measured a 15-prompt reasoning set at mean 675 tokens against 1401 for base Qwen3.6-27B). Served on mini as the Q4_K_M gguf with the MTP draft head embedded in the file, so speculative decoding needs no second model."
