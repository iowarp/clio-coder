      llamaCpp: "Primary verified path. OpenAI-compatible chat completions with --jinja, --reasoning on, --reasoning-effort medium as server defaults; reasoning_content and tool_calls both confirmed to parse correctly. A request can override to off with chat_template_kwargs.enable_thinking:false, or to a different active level with reasoning_effort in {low, medium, xhigh} (never minimal/high/max on the wire; the stock template raises a fatal jinja exception on those and Clio's landed capability resolver already clamps to this set)."
      lmstudioOpenaiCompat: "Clio sends reasoning_effort over LM Studio's OpenAI-compatible HTTP port and omits chat_template_kwargs because LM Studio does not use that field for this model. With no override, LM Studio defaults this model to thinking off, unlike raw llama.cpp's template default of thinking on/xhigh. reasoning_effort:'none' explicitly disables it."
      lmstudioNative: "Clio's LM Studio runtime uses the OpenAI-compatible HTTP chat adapter with native REST model discovery and residency management."
    llamaCpp:
      ctxSize: 131072
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      parallel: 2
      parallelSlots: "Start the server with --parallel 2 to serve the orchestrator and one worker at once. Clio then discovers total_slots from /props and admits two concurrent requests against this endpoint; a server started with --parallel 1 discovers one slot, and a dispatch during the orchestrator's own turn is refused rather than queued."
      batchSize: 1024
      ubatchSize: 256
      mmproj: true
      reasoning: "on"
      reasoningEffort: medium
      specType: draft-mtp
      specDraftNMax: 1
    thinking:
      mechanism: effort-levels
      effortByLevel:
        low: low
        medium: medium
        high: xhigh
        xhigh: xhigh
      guidance: |
        Official Qwen3.8-27B chat template (chat_template.jinja) validates
        reasoning_effort against exactly {xhigh, medium, low} and raises a
        fatal jinja exception (hard 500, not a graceful fallback) on anything
        else, including minimal/high/max. The 27B card gives no /think or
        /no_think soft switch for this model; unlike Qwen3, that idiom has no
        effect here. Off must go through chat_template_kwargs.enable_thinking:
        false, never through reasoning_effort. preserve_thinking should stay
        on for an agentic harness (the template's own recommendation for
        agent scenarios; improves KV cache reuse). llama.cpp's own
        reasoning_effort:"none" also disables reasoning at the server layer
        and is a separate mechanism from the template's enable_thinking flag;
        both were verified independently on llama.cpp and on LM Studio's HTTP
        port.

        Thinking off is verified for this family, and no floor is imposed on
        it. JetBrains report that Qwen3.8 without reasoning gets stuck in a
        loop repeating the same tool call indefinitely under Junie. Clio's
        shipped default is orchestrator.thinkingLevel: off, which on llama.cpp
        sends chat_template_kwargs.enable_thinking:false and on LM Studio's
        OpenAI-compatible port sends reasoning_effort:"none". Clio 0.3.8 ran
        that configuration on both runtimes (llama.cpp build b226-2115b73d8 on
        ROCm, LM Studio 2.29.0) through the v0.3.9 local-inference campaign on
        2026-08-29 and 2026-08-30: an interactive build-and-resume session, a
        three-worker fleet step, and a ten-task eval suite totalling 116 model
        calls, none of which repeated a tool call into a loop. The catalog
        therefore imposes no thinking floor and coerces no level for this
        family. If a future build or quantization regresses into the loop
        JetBrains describe, the guards that catch it are Clio's own, not a
        catalog setting: the tool-prose-loop detector
        (src/interactive/tool-prose-loop.ts), which is armed on the
        local-native tier, and the stalled-turn middleware
        (src/domains/middleware/stalled-turn.ts).
    serving: "Qwen3.8-27B (unsloth/Qwen3.8-27B-GGUF), hybrid qwen3_5 architecture: 3 linear-attention (Gated DeltaNet) layers per 1 full-attention layer, so only 16 of 64 layers hold a conventional KV cache. Native ctx 262144, extensible to 1M via YaRN (out of scope for the hardware classes above; leave rope at default). Tool calls use an XML <tool_call><function=...> form in the stock template; llama.cpp's qwen3_coder parser converts this to standard tool_calls JSON, verified live on ROCm, CUDA, and Vulkan backends. Only messages[0] may be a system message and only system/user/assistant/tool roles are accepted; a second system message or a developer role raises a template error. The recurrent layers set the prefix-cache economics: llama.cpp cannot roll gated-deltanet state back to an arbitrary token, so a divergence anywhere inside a cached prefix re-prefills from the last context checkpoint rather than from the changed byte. Checkpoints are written at the end of each processed prompt and only when at least --checkpoint-min-step tokens separate them, so the server's checkpoint count and --checkpoint-min-step are a quality variable on this family and not a tuning detail: measured on the configuration recorded in measuredUnder, one changed line inside an earlier turn of a four-turn conversation cost cache_n 9 and 17.9 s at the build defaults (32 checkpoints, min step 8192) and cache_n 7570 and 10.9 s at 64 checkpoints and min step 1024. A single prefill writes one checkpoint at its end, so a 16.7K-token prompt re-sent with one changed line re-prefills from zero (18.4 s) under both settings, while changing only the final user message re-prefills the last ubatch (prompt_n 517, 1.4 s). Serving this family with --parallel greater than 1 divides --ctx-size across slots unless --kv-unified is set."

