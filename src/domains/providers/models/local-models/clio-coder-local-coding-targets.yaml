    - qwopus3.6-35b-a3b-coder
    - qwopus3.6-35b-a3b
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    # Reasoning class: effort-levels, measured against an LM Studio host on
    # 2026-08-08 over its OpenAI-compatible surface. The card
    # frames the Coder-MTP line as thinking-off execution, but the wire
    # disagrees: on "what is 17+25" this model spends 98 of 103 completion
    # tokens on reasoning, and a wiki planning dispatch spent 89,501. It is an
    # always-reasoning model unless told otherwise.
    #
    # chat_template_kwargs enable_thinking is inert here (verified with unique
    # prompts to rule out cache hits). reasoning_effort "none" is the control
    # that works, taking the same prompt from 98 reasoning tokens to 0, which
    # is why `off` is mapped explicitly below rather than left unsent.
    #
    # reasoning=false previously resolved to mechanism "none", and mechanism
    # "none" makes openai-completions strip reasoning_effort from the payload.
    # The flag set to suppress thinking was the reason it could not be
    # suppressed.
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: true
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 262144
    maxTokens: 32768
  quirks:
    measuredUnder:
      hardware: unknown
      runtime: "lmstudio and its OpenAI-compatible port for the reasoning findings; an unrecorded llama.cpp host for the presence-penalty finding"
      build: "unknown for both dates; the Windows LM Studio measurement host's bundled build string was first recorded on 2026-08-29 as llama.cpp-win-x86_64-nvidia-cuda12-avx2, which is three weeks after the reasoning measurement and cannot be backdated to it"
      llamaCpp: "unknown; the reasoning measurement went through LM Studio's HTTP port, which does not expose the underlying server argv, and no argv survives for the dispatch that produced the presence-penalty value"
      date: "2026-08-08 (reasoning_effort and enable_thinking), 2026-07-06 (presence penalty)"
      source: "commits b3db3b82 and f7d76bf4"
      note: |
        Three numbers here are measurements. On 2026-08-08 on that host this
        model spent 98 of 103 completion tokens reasoning on "what is 17+25"
        with no thinking field set; chat_template_kwargs enable_thinking was
        inert, re-checked with unique prompts to rule out prompt-cache hits;
        and reasoning_effort "none" took the same prompt to 0. The same session
        recorded a wiki planning dispatch over a 1007-file repository going
        from 89,501 reasoning tokens, 47 tool calls and exit 1 at 459 s to 0
        reasoning tokens, 8 tool calls and exit 0 at 218 s. On 2026-07-06 a
        live dispatch measured presence_penalty 1.5: without it a coder worker
        repeated one code_nav call into the loop-guard abort on 3 of 3 runs,
        and with it the same task passed 3 of 3. Neither commit records the
        hardware or the server configuration, so both stay unknown.
    sampling:
      instruct:
        temperature: 0.2
        topP: 0.9
        topK: 20
        repeatPenalty: 1.05
        # Upstream Qwen3.6 card recommends presence_penalty 1.5 for
        # non-thinking modes to suppress repetition loops. Measured on live
        # dispatch (2026-07-06): without it a coder worker repeated one
        # code_nav call into the loop-guard abort on 3 of 3 runs; with it the
        # same task passed 3 of 3 with clean edit-then-validate trajectories.
        presencePenalty: 1.5
    gpuTiers:
      "32gb": "Default 32 GB local profile: Q4_K_M, ctx=262144, q8 KV, flash attention, parallel=1, with F32 mmproj (vision) and draft-mtp speculative decoding both active. Leaves several GiB free at 262k on a 32 GiB class card."
    runtimePreference:
      llamaCpp: "OpenAI-compatible chat completions with --jinja. Recommended local profile serves text-only with reasoning off and enable_thinking false; coder sampler temperature 0.2, top_p 0.9, top_k 20."
      openaiCompat: "Use when a gateway fronts the same llama.cpp chat-completions surface with qwen tool parsing."
    llamaCpp:
      ctxSize: 262144
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      parallel: 1
      parallelSlots: "Start the server with --parallel 1 so one agent gets the whole 262144-token context. Clio discovers total_slots 1 and admits one request at a time on this endpoint. This family is often the workers.default model on a router that also serves the orchestrator, and a one-slot router refuses the worker batch rather than queueing it; a second server or an explicit maxConcurrentRequests on the target is the remedy."
      batchSize: 2048
      ubatchSize: 512
      mmproj: true
      chatTemplateKwargs:
        enable_thinking: false
    thinking:
      mechanism: effort-levels
      effortByLevel:
        # "none" is the only value that silences this family. It is carried on
        # the wire because the model reasons by default, so sending nothing is
        # in effect a request to keep reasoning.
        off: none
        low: low
        medium: medium
        high: high
      guidance: |
        Qwopus3.6 35B-A3B Coder reasons unless reasoning_effort is set to
        "none", despite the creator's card describing the Coder-MTP variants as
        thinking-off. That dial only reaches the wire on openai-compat; the LM
        Studio native transport has no field for it, so a native-routed run
        reasons at full rate whatever the configured thinking level says.
    serving: "Jackrong Qwopus3.6 35B-A3B Coder MTP, Q4_K_M. Thinking-off coder/agent tuned for tool-use loops. Served as a local router default with MTP speculative decoding (spec-type draft-mtp, n_max 2) and F32 mmproj vision both active at 262k."

