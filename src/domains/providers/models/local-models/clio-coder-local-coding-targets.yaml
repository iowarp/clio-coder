    serving: "Use the llama.cpp settings listed above for a 262144-token local profile."

- family: nemotron-3-nano-omni-30b-a3b-reasoning
  matchPatterns:
    - nvidia-nemotron-3-nano-omni-30b-a3b-reasoning
    - nemotron-3-nano-omni-30b-a3b-reasoning-ud-q4_k_m
    - nemotron-3-nano-omni-30b-a3b-reasoning
    - nemotron-3-nano-omni
    - nemotron-nano-omni
    # Both router spellings. The live mini router advertises the id with `moe`
    # in it; issue #263 and the round-5 handoffs use the shorter one.
    - nemotron3-30b-moe-omni
    - nemotron3-30b-omni
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: true
    audio: true
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 1048576
    maxTokens: 131072
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD Radeon AI PRO R9700 32 GB, Vulkan backend, 4 request slots"
      runtime: llamacpp
      build: "worker llama-server from /home/akougkas/src/llama.cpp-b10687/build-vulkan/bin, behind a router reporting build_info b1-c841aee (the string the ornith-1.5 entry below records for this same host on this date)"
      model: "Nemotron-3-Nano-Omni-30B-A3B-Reasoning UD-Q4_K_M with Nemotron-Omni-mmproj-F16 (arch nemotron_h_moe)"
      llamaCpp: >-
        --ctx-size 1032192 --parallel 4 --kv-unified --cache-type-k f16
        --cache-type-v f16 --batch-size 16384 --ubatch-size 2048 --flash-attn
        true --n-gpu-layers 99 --jinja --reasoning on --temperature 0.6 --top-k
        40 --top-p 0.95 --repeat-penalty 1.05
      date: "2026-09-02"
      source: "issue #263 thinking sweep: one non-streaming POST /v1/chat/completions per variant on a one-line arithmetic prompt, max_tokens 4096"
      note: |
        The on-off classification is measured, and it replaces a budget-tokens
        dial that never reached this runtime. With no thinking field the model
        spent 54 completion tokens with 140 characters of reasoning_content;
        with chat_template_kwargs.enable_thinking false it answered in 4 tokens
        with none; with it true it spent 42 tokens and 119 characters.
        reasoning_effort moved nothing: none, low, and high produced 43, 48, and
        39 tokens and a reasoning trace every time. The budget-tokens mechanism
        this entry used to declare is downgraded to informational for
        openai-completions on llama.cpp with a qwen chat template
        (acceptsBudgetTokensField in model-runtime-capabilities.ts), so no
        budget ever reached the server and the model reasoned at every level.
        The router agrees with the measurement, advertising reasoning:on_off
        with default_reasoning:on.

        The measuring server is not the recommended profile below: it ran
        ctx-size 1032192 with f16 KV against the 819200 and q8_0 recommended
        here, and loaded only the vision mmproj, so the audio capability stays
        the card's claim rather than this run's.
    sampling:
      thinking:
        temperature: 0.6
        topP: 0.95
        topK: 20
      instruct:
        temperature: 0.2
        topK: 1
    gpuTiers:
      "24gb": "Use a 4-bit quant with reduced load context for evaluation. Prefer the 32GB tier for sustained Clio writes."
      "32gb": "Primary strong local model for multimodal main-agent work. Keep openai-compat available for tool-call fallback."
    runtimePreference:
      lmstudio: "Use LM Studio per-model load settings unless this target carries explicit lmstudio.load overrides."
      openaiCompat: "Use for a generic gateway that fronts the same OpenAI-compatible chat surface."
      llamaCpp: "OpenAI-compatible chat completions with --jinja."
    llamaCpp:
      ctxSize: 819200
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      parallel: 4
      parallelSlots: "Start the server with --parallel 4, and add --kv-unified unless each of the four slots is meant to get 204800 tokens rather than the whole 819200. Clio admits four concurrent requests on this endpoint once /props reports total_slots 4."
    thinking:
      mechanism: on-off
      chatTemplateKwargs:
        static:
          # Card recipe for the reasoning mode (scratchpad/catalog/models/nvidia-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8.md:7): reasoning_budget=16384.
          reasoning_budget: 16384
        lmstudio: unsupported
      guidance: |
        Reasoning is template-driven and the switch is
        chat_template_kwargs.enable_thinking; intermediate levels coerce to on.
        The checkpoint reasons when nothing is sent, so off has to be carried on
        the wire rather than omitted. reasoning_effort is inert on llama.cpp;
        LM Studio reads the same on-off switch from that field instead.
    serving: "Use qwen3_coder tool parsing when served through OpenAI-compatible HTTP. LM Studio uses the same OpenAI-compatible tool surface."

# NVIDIA's 3.5 Lightning generation, not a requant of the Nano Omni family
# above: a different HF repo (nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B),
# text-only where Nano Omni carries vision and audio, and a Mamba-2 plus MoE
# plus attention hybrid rather than the omni checkpoint. They share the vendor,
# the nemotron_h_moe arch string, and the 30B-A3B parameter count, which is not
# the same as sharing weights.
- family: nemotron-3.5-lightning-30b-a3b
  matchPatterns:
    # No bare `nemotron-3.5-lightning`: the 30b spelling is the shortest one
    # that cannot swallow a future 8B or 70B Lightning id, which would inherit
    # this checkpoint's sampler, its 1M window and a dial measured elsewhere.
    - nvidia-nemotron-3.5-lightning-30b-a3b
    - nemotron-3.5-lightning-30b-a3b
    - nemotron-3.5-lightning-30b
    - nemo3.5-30b-moe
  capabilities:
    chat: true
    tools: true
    toolCallFormat: qwen
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: false
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 1048576
    maxTokens: 65536
  quirks:
    measuredUnder:
      hardware: "mini fleet node, AMD Radeon AI PRO R9700 32 GB, Vulkan backend, 1 request slot"
      runtime: llamacpp
      build: "worker llama-server from /home/akougkas/src/llama.cpp-b10687/build-vulkan/bin, behind a router reporting build_info b1-c841aee"
      model: "NVIDIA-Nemotron-3.5-Lightning-30B-A3B Q4_K_M (arch nemotron_h_moe)"
      llamaCpp: >-
        --ctx-size 1048576 --parallel 1 --kv-unified --cache-type-k f16
        --cache-type-v f16 --batch-size 16384 --ubatch-size 2048 --flash-attn
        true --fit off --n-gpu-layers 99 --jinja --reasoning on
        --chat-template-kwargs {"enable_thinking": true} --temperature 1.0
        --top-k 40 --top-p 0.95 --repeat-penalty 1.05
      date: "2026-09-02"
      source: "issue #263 thinking sweep: one non-streaming POST /v1/chat/completions per variant on a one-line arithmetic prompt, max_tokens 4096"
      note: |
        The mechanism is measured on this runtime and the card agrees with it.
        With no thinking field the model spent 97 completion tokens with 300
        characters of reasoning_content; with
        chat_template_kwargs.enable_thinking false it answered in 3 tokens with
        none; with it true it spent 120 tokens and 353 characters.
        reasoning_effort is inert: none, low, and high produced 127, 114, and
        117 tokens with a reasoning trace every time. The NVIDIA card states the
        same control, "Reasoning Mode: Configurable on/off via chat template
        (enable_thinking=True/False)", and the router advertises reasoning:on_off
        with default_reasoning:on.

        The same divergence is already recorded in code for this checkpoint:
        model-runtime-capabilities.ts notes a 2026-08-11 fleet measurement on
        nvidia-nemotron-3.5-lightning-30b-a3b where LM Studio suppressed
        reasoning for reasoning_effort "none" and ignored enable_thinking false
        while llama.cpp did the reverse. That id is a matchPattern here.

        Sampler provenance: temperature 1.0 and top_p 0.95 are the card's
        "Recommended Sampling"; top_k 40 and repeat_penalty 1.05 are the router
        preset's launch arguments and have no card value. The card publishes no
        separate thinking and instruct profiles, so both carry the same numbers.
        maxTokens follows nemotron-cascade-2, the other 1M-context Nemotron in
        this catalog; the card caps output only by the context window.
    sampling:
      thinking:
        temperature: 1.0
        topP: 0.95
        topK: 40
        repeatPenalty: 1.05
      instruct:
        temperature: 1.0
        topP: 0.95
        topK: 40
        repeatPenalty: 1.05
    gpuTiers:
      "32gb": "Text-only agent target on a 32 GB card. Q4_K_M weights plus f16 KV reach the full 1048576-token window at parallel 1 on the measured server."
    runtimePreference:
      llamaCpp: "OpenAI-compatible chat completions with --jinja and --reasoning on. The router profile pins chat_template_kwargs.enable_thinking true, so a request that wants silence must send false rather than omitting the field."
      openaiCompat: "Use when a gateway fronts the same llama.cpp chat-completions surface with qwen tool parsing."
      lmstudio: "LM Studio reads the on-off switch from reasoning_effort, not from chat_template_kwargs; see the 2026-08-11 note above."
    llamaCpp:
      ctxSize: 1048576
      cacheTypeK: f16
      cacheTypeV: f16
      flashAttn: true
      nGpuLayers: 99
      parallel: 1
      parallelSlots: "Start the server with --parallel 1 so one agent gets the whole 1048576-token context, and add --kv-unified if --parallel is raised or the context is divided across slots. Clio discovers total_slots 1 and admits one request at a time on this endpoint, so a dispatch raised while the orchestrator streams is refused rather than queued."
      batchSize: 16384
      ubatchSize: 2048
      chatTemplateKwargs:
        enable_thinking: true
    thinking:
      mechanism: on-off
      chatTemplateKwargs:
        static:
          # Card: "For coding agents, add extra_body={"chat_template_kwargs": {"force_nonempty_content": True}}" (scratchpad/catalog/models/nvidia-NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16.md:21).
          force_nonempty_content: true
        lmstudio: unsupported
      guidance: |
        Nemotron 3.5 Lightning's chat template exposes thinking as on or off
        through enable_thinking; intermediate levels coerce to on. It reasons by
        default, so off has to be carried on the wire. On LM Studio the same
        switch is read from reasoning_effort instead, which Clio sends for
        on-off models on that runtime.
    serving: "NVIDIA-Nemotron-3.5-Lightning-30B-A3B, MoE hybrid of Mamba-2, MoE and attention layers with 3B active parameters. The card recommends nemotron_v3 reasoning parsing and qwen3_coder tool parsing; the mini router serves the Q4_K_M gguf with XML tool calls through llama.cpp's qwen3_coder parser. Native context is 1M."

