# Clio Coder files pane: engine configuration. The pane host lists the pane by
# the label Clio sets ("files"); this file only shapes what the engine shows.

[mgr]
show_hidden = true

[[plugin.prepend_fetchers]]
id = "git"
group = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id = "git"
group = "git"
url = "*/"
run = "git"
