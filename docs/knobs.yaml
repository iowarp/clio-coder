    controls: Uncommitted per-developer hooks with the same schema as `hooks.yaml`, layered above it by `id`.
    verdict: document
  - name: hooks[]
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: "User hook declarations, either a bare list or `{hooks: [...]}`; a project hook with the same `id` as a user or extension hook replaces it, and `hooks.local.yaml` replaces both."
    precedence: "`hooks.local.yaml` > `hooks.yaml` > user hooks > extension hooks, by `id`"
    verdict: keep
  - name: hooks[].argv
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Argv list a `command` hook executes without a shell.
    verdict: keep
  - name: hooks[].as
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    default: annotate
    controls: "Where a `command` hook's output lands: `annotate` on the tool result or `reminder` as an injected reminder."
    verdict: keep
  - name: hooks[].cwd
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Working directory for a `command` hook, defaulting to the session cwd.
    verdict: keep
  - name: hooks[].effect
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: The middleware effect object an `effect` hook emits, validated like a built-in middleware effect.
    verdict: keep
  - name: hooks[].enabled
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    default: "true"
    controls: "`false` keeps the declaration but never fires it, which is how a lower layer's hook is switched off."
    verdict: keep
  - name: hooks[].id
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Stable id used for overrides across layers; derived from the source and a content hash when absent.
    verdict: keep
  - name: hooks[].kind
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: "`command` runs an argv and injects its output, `prompt` injects a fixed reminder, `effect` emits one declared middleware effect."
    verdict: keep
  - name: hooks[].message
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Reminder text a `prompt` hook injects, truncated to 2000 characters.
    verdict: keep
  - name: hooks[].on
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Middleware phase the hook fires on (a `MiddlewareHook` name such as `turn_end` or `tool_result`).
    verdict: keep
  - name: hooks[].severity
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    default: info
    controls: Reminder severity for a `prompt` hook (`info`, `warning`, ...), which decides how the reminder is rendered.
    verdict: document
  - name: hooks[].timeoutMs
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    default: "2000"
    controls: Wall-clock cap for a `command` hook, clamped to 100 to 5000 ms.
    verdict: keep
  - name: hooks[].tools
    kind: project-file
    owner: middleware
    file: .clio-coder/hooks.yaml
    controls: Tool names a tool-scoped hook applies to; absent means every tool.
    verdict: keep
  - name: commitMessageStyle
    kind: project-file
    owner: context
    file: .clio-coder/profile.yaml
    controls: Commit message style Clio writes in, `conventional`, `descriptive`, or `terse`.
    precedence: project `.clio-coder/profile.yaml` > user `<configDir>/profile.yaml`, field by field
    verdict: document
  - name: localOnlyPaths
    kind: project-file
    owner: context
    file: .clio-coder/profile.yaml
    controls: Paths the operator marks as never to leave the machine, at most 8 rendered into the prompt.
    precedence: project `.clio-coder/profile.yaml` > user `<configDir>/profile.yaml`, field by field
    verdict: document
  - name: responsePosture
    kind: project-file
    owner: context
    file: .clio-coder/profile.yaml
    controls: Operator response posture rendered into the prompt, `concise`, `balanced`, or `thorough`.
    precedence: project `.clio-coder/profile.yaml` > user `<configDir>/profile.yaml`, field by field
    verdict: document
  - name: validationPreference
    kind: project-file
    owner: context
    file: .clio-coder/profile.yaml
    controls: How the operator wants changes validated, `tests-first`, `manual`, or `trust`.
    precedence: project `.clio-coder/profile.yaml` > user `<configDir>/profile.yaml`, field by field
    verdict: document
  - name: (prompt templates)
    kind: project-file
    owner: resources
    file: .clio-coder/prompts
    controls: Markdown prompt templates (`<name>.md`) that become slash commands named after the file, beside the user `prompts/` directory in the config dir.
    precedence: project `.clio-coder/prompts/` > user `<configDir>/prompts/`, by name
    verdict: keep
  - name: description
    kind: project-file
    owner: context
    file: .clio-coder/rules
    controls: One-line summary shown by `clio-coder config inspect`.
    verdict: keep
  - name: enabled
    kind: project-file
    owner: context
    file: .clio-coder/rules
    default: "true"
    controls: "`false` keeps the rule file but never loads it."
    verdict: keep
  - name: excludes
    kind: project-file
    owner: context
    file: .clio-coder/rules
    controls: Globs a rule contributes to the project context-exclude set.
    verdict: keep
  - name: paths
    kind: project-file
    owner: context
    file: .clio-coder/rules
    controls: Activation globs in a rule's frontmatter; present means the rule loads only while a matching file is in working context, absent means it always loads with project context.
    verdict: keep
  - name: commands[]
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Project-declared commands the bash tool may run under a declared action class; each entry is an id plus command line and its own bounds.
    verdict: keep
  - name: commands[].actionClass
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Action class (`read`, `edit`, `execute`, ...) the command is admitted as, which decides which autonomy level may run it without approval.
    verdict: keep
  - name: commands[].command
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: The exact command line the entry admits; a bash call matches it verbatim.
    verdict: keep
  - name: commands[].comment
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Free-text note on the entry, informational.
    verdict: keep
  - name: commands[].cwd
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Working directory, relative to the workspace root, the command must run in.
    verdict: keep
  - name: commands[].env
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Environment policy for the command, `mode` (`none` or `allowlist`) plus `allow`, the variable names passed through.
    verdict: keep
  - name: commands[].env.allow
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Environment variable names passed through to the command when `mode` is `allowlist`.
    verdict: keep
  - name: commands[].env.mode
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    default: none
    controls: "`none` runs the command with the scrubbed base environment; `allowlist` adds the variables named in `allow`."
    verdict: keep
  - name: commands[].id
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Stable id the policy engine and receipts name the command by.
    verdict: keep
  - name: commands[].maxOutputBytes
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Output byte cap for the command before truncation.
    verdict: document
  - name: commands[].owner
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Free-text owner of the entry, informational.
    verdict: keep
  - name: commands[].rationale
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Free-text reason shown beside the command in approvals and receipts.
    verdict: document
  - name: commands[].requireConfirmation
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    default: "false"
    controls: "`true` parks the command for operator approval even at an autonomy level that would otherwise run it."
    verdict: keep
  - name: commands[].shellOperators
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    default: deny
    controls: "`allow` admits pipes, redirects, and chaining in the command line; `deny` refuses them."
    verdict: keep
  - name: commands[].timeoutMs
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Wall-clock cap for the command; overrides the bash call's own `timeout_ms`.
    verdict: keep
  - name: disableDefaultPathPolicy
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    default: "false"
    controls: "`true` drops the built-in path policy (protected dotfiles, secrets, build outputs) so only the file's own path lists apply."
    verdict: document
  - name: noDeletePaths
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Globs tools may read and write but never delete.
    verdict: keep
  - name: noWritePaths
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Globs tools may read and delete but never write.
    verdict: keep
  - name: readOnlyPaths
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Globs tools may read but never write or delete.
    verdict: keep
  - name: tasks
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Accepted root key reserved for task policy; nothing in the loader reads its value beyond accepting it.
    verdict: keep
    note: "`ROOT_KEYS` in src/domains/safety/project-policy.ts admits `tasks` but no parser consumes it; it is a reserved key, not a knob."
  - name: version
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    default: "1"
    controls: Policy file schema version; must be 1.
    verdict: keep
  - name: zeroAccessPaths
    kind: project-file
    owner: safety
    file: .clio-coder/safety.yaml
    controls: Globs no tool may read, write, or list.
    verdict: document
  - name: (layered subset of settings.yaml)
    kind: project-file
    owner: config
    file: .clio-coder/settings.local.yaml
    controls: Per-developer, uncommitted settings layered over the project file; credential-bearing keys (`auth`, `apiKey`, `token`, `secret`, `password`) are stripped with a diagnostic.
    precedence: CLI flags > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user `settings.yaml` > built-in default
    verdict: document
  - name: (layered subset of settings.yaml)
    kind: project-file
    owner: config
    file: .clio-coder/settings.yaml
    controls: Committed team settings; any settings-v2 key except credentials, deep-merged over the user file with arrays replaced wholesale.
    precedence: CLI flags > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user `settings.yaml` > built-in default
    verdict: document
  - name: (skill directories)
    kind: project-file
    owner: resources
    file: .clio-coder/skills
    controls: Project skills (`<name>/SKILL.md`); third-party imports are inert until `integrations.projectResources.trustProjectImports` or `CLIO_CODER_TRUST_PROJECT_RESOURCES=1` trusts them.
    precedence: explicit `--skill` paths > project skills > user skills > catalog skills, by name
    verdict: keep
  - name: (presence)
    kind: project-file
    owner: safety
    file: .clio-coder/validation.yaml
    controls: The file's presence (also `validation.yml`, root `validation.yaml`, or `VALIDATION.md`) raises the repo-derived rigor default from `normal` to `high`; its content is not read.
    precedence: "`CLIO_CODER_RIGOR` > presence of a validation contract > `normal`"
    verdict: keep
  - name: checks[]
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Declared verification checks the `verify` tool and `dispatch` intent may name by id, at most 128.
    verdict: keep
  - name: checks[].command
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Argv list (no shell) the check runs, at most 64 entries of 4096 bytes.
    verdict: keep
  - name: checks[].cwd
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Working directory relative to the workspace root, resolved and bounded to the workspace.
    verdict: keep
  - name: checks[].description
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: One-line description shown in the `verify` listing, at most 512 bytes.
    verdict: keep
  - name: checks[].id
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Check id, at most 64 bytes; `frontend` is reserved for the built-in artifact check.
    verdict: keep
  - name: checks[].tags
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Free-form labels, at most 16 of 32 bytes, shown in the listing.
    verdict: keep
  - name: checks[].timeoutMs
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    controls: Required wall-clock cap for the check in ms, a positive integer at most 900000; a `verify` call may shorten it with `timeout_ms` but not exceed it.
    verdict: keep
  - name: version
    kind: project-file
    owner: tools
    file: .clio-coder/verifiers.yaml
    default: "1"
    controls: Catalog schema version; must equal the version this build speaks.
    verdict: keep
  - name: bash.command
    kind: tool-arg
    owner: bash
    class: task
    controls: Bash command to execute.
    verdict: keep
  - name: bash.cwd
    kind: tool-arg
    owner: bash
    class: task
    controls: Omit unless the command must run in a subdirectory of the workspace root, given as a relative path; outside the root is blocked.
    verdict: keep
  - name: bash.output_policy
    kind: tool-arg
    owner: bash
    class: policy
    default: bounded
    controls: Model-context disposition. Omit for bounded tail output. Use summary for noisy runs, metadata-only when only status and retrieval matter, and full only for known-small output.
    verdict: keep
  - name: bash.timeout_ms
    kind: tool-arg
    owner: bash
    class: policy
    controls: Timeout in milliseconds.
    verdict: keep
  - name: context.include_tree
    kind: tool-arg
    owner: context
    class: policy
    controls: "scope=skills: list files under the skill base_dir."
    verdict: keep
  - name: context.limit
    kind: tool-arg
    owner: context
    class: policy
    controls: "scope=docs: max sections (default 5, max 12)."
    verdict: keep
  - name: context.name
    kind: tool-arg
    owner: context
    class: task
    controls: "scope=skills: skill name to load; omit to list."
    verdict: keep
  - name: context.query
    kind: tool-arg
    owner: context
    class: task
    controls: "scope=docs: question or terms; omit to list the corpus."
    verdict: keep
  - name: context.ref
    kind: tool-arg
    owner: context
    class: task
    controls: "scope=recall: ref of the evicted item, as named in its marker."
    verdict: keep
  - name: context.scope
    kind: tool-arg
    owner: context
    class: policy
    controls: Context source.
    verdict: keep
  - name: dispatch.$defs.budget
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Reusable tool-call budget object referenced from the top level and from every task; a budget outside the recipe's declared range is refused at admission.
    precedence: task `budget` > call `budget` > recipe `budget`
    verdict: keep
  - name: dispatch.$defs.budget.readReserve
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Tail of the budget kept for verification reads and synthesis; non-read calls inside the reserve are blocked.
    verdict: keep
  - name: dispatch.$defs.budget.retryRevision
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Preauthorized budget for one retry or revision phase (a review `revise` re-run), so the re-run needs no second approval.
    verdict: keep
  - name: dispatch.$defs.budget.retryRevision.readReserve
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Read reserve for the retry or revision phase.
    verdict: keep
  - name: dispatch.$defs.budget.retryRevision.toolCalls
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Tool-call ceiling for the retry or revision phase.
    verdict: keep
  - name: dispatch.$defs.budget.toolCalls
    kind: tool-arg
    owner: dispatch
    class: policy
    controls: Tool calls the worker may spend before the synthesis reserve window opens; must sit within the recipe's `budget.toolCalls` to `budget.maximum.toolCalls` range.
    verdict: keep
