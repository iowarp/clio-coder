version: 1
constantScopes:
  - src/engine/loop-guard.ts
  - src/domains/dispatch/intent.ts
  - src/domains/dispatch/validation.ts
  - src/domains/dispatch/gate-role-prompts.ts
  - src/domains/dispatch/delegation-plan.ts
  - src/domains/agents/result-contract.ts
  - src/domains/agents/fleet-contract.ts
  - src/domains/session/compaction/defaults.ts
  - src/domains/session/compaction/auto.ts
  - src/core/context-floor.ts
  - src/core/guardrails.ts
  - src/domains/middleware/budget.ts
  - src/domains/middleware/memory-intervention.ts
  - src/domains/middleware/hooks.ts
  - src/domains/middleware/watchdog.ts
  - src/domains/context/bootstrap-prompt.ts
  - src/domains/context/operator-profile.ts
  - src/domains/memory/task-bank.ts
  - src/tools/dispatch-arguments.ts
  - src/tools/observation.ts
  - src/interactive/chat-renderer.ts
toolArgScopes:
  - dispatch
  - bash
  - context
  - verify
entries:
  - name: AI_AGENT
    kind: env
    owner: cli
    default: unset
    controls: Clio exports `clio-coder` into every child it spawns (bash tool, workers, code steps, hooks) so child tooling can identify the launching agent; Clio itself only checks it inside the managed git hook.
    verdict: keep
  - name: APPDATA
    kind: env
    owner: core
    default: ~\AppData\Roaming
    controls: Windows-only base directory for the config and data roots (`%APPDATA%\clio-coder\config`, `%APPDATA%\clio-coder\data`); ignored on other platforms.
    verdict: keep
  - name: CI
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value marks a CI run and makes smooth-streaming `auto` fall back to the immediate coalescer instead of paced animation; explicit `on` is unaffected.
    verdict: keep
    note: docs mention CI only as a concept; no page documents the variable itself.
  - name: CLIO_CODER_ALLOW_EXTERNAL_FULL_ACCESS
    kind: env
    owner: providers
    default: off
    controls: Exactly `1` lets a `full-auto` dispatch to the claude-code or antigravity-code subprocess runtime pass their dangerous skip-permissions flag; any other value keeps the bypass closed.
    verdict: keep
  - name: CLIO_CODER_BIN_DIR
    kind: env
    owner: cli
    default: ~/.local/bin
    controls: Directory holding the `clio-coder` launcher symlink that uninstall removes and the install script creates; a path, defaulting to `~/.local/bin`.
    verdict: keep
  - name: CLIO_CODER_BUS_TRACE
    kind: env
    owner: core
    default: off
    controls: Exactly `1` subscribes a tracer to the shutdown, session-end, and domain lifecycle bus channels and writes one `[clio-coder:bus]` line per event to stderr.
    verdict: keep
  - name: CLIO_CODER_CACHE_DIR
    kind: env
    owner: cli
    default: platform default (`$XDG_CACHE_HOME/clio-coder`, else `~/.cache/clio-coder`)
    controls: Absolute path for the cache root; beats `CLIO_CODER_HOME/cache` and the platform default, and the fleet-view pane child re-pins it from argv.
    precedence: env > `CLIO_CODER_HOME/cache` > `XDG_CACHE_HOME` or platform default
    verdict: keep
  - name: CLIO_CODER_COMMIT_ASSISTED
    kind: env
    owner: core
    default: unset
    controls: Set by Clio to `1`/`0` per spawn from the run's attribution evidence; the managed `prepare-commit-msg` hook reads it to append the assisted trailer, and nested seams strip it.
    verdict: keep
  - name: CLIO_CODER_COMMIT_AUTHORED
    kind: env
    owner: core
    default: unset
    controls: Set by Clio to `1`/`0` per spawn from the run's attribution evidence; the managed `prepare-commit-msg` hook reads `1` to add the co-authored trailer, and nested seams strip it.
    verdict: keep
  - name: CLIO_CODER_CONFIG_DIR
    kind: env
    owner: cli
    default: platform default (`$XDG_CONFIG_HOME/clio-coder`, else `~/.config/clio-coder`)
    controls: Absolute path for the config root; beats `CLIO_CODER_HOME/config` and the platform default, and the fleet-view pane child re-pins it from argv.
    precedence: env > `CLIO_CODER_HOME/config` > `XDG_CONFIG_HOME` or platform default
    verdict: keep
  - name: CLIO_CODER_DATA_DIR
    kind: env
    owner: cli
    default: platform default (`$XDG_DATA_HOME/clio-coder`, else `~/.local/share/clio-coder`)
    controls: Absolute path for the data root; beats `CLIO_CODER_HOME/data` and the platform default, and the fleet-view pane child re-pins it from argv.
    precedence: env > `CLIO_CODER_HOME/data` > `XDG_DATA_HOME` or platform default
    verdict: keep
  - name: CLIO_CODER_DEBUG_SHUTDOWN
    kind: env
    owner: core
    default: off
    controls: Exactly `1` prints timed `[clio-coder:shutdown]` phase lines and full stack traces of failing domain `stop()` hooks to stderr during shutdown.
    verdict: keep
  - name: CLIO_CODER_ENDPOINT_SLOTS_TTL_MS
    kind: env
    owner: providers
    default: "86400000"
    controls: Positive integer milliseconds a persisted endpoint slot count stays valid for an endpoint this process has not probed; older records are ignored and pruned.
    precedence: env > built-in default (no settings key)
    verdict: keep
  - name: CLIO_CODER_EVAL_RUNNER_STDOUT_FILE
    kind: env
    owner: cli
    default: unset
    controls: Set by the eval suite runner to the path of the captured runner stdout JSONL for a task's measure step; read only by external graders (evals/behavioral-corpus-grader.mjs), never by src.
    verdict: keep
    note: No page under docs/ mentions it. The hygiene scanner misses it because the name is a string argument to namingCompatibilityEnvironment. src/cli/doctor-naming.ts:36 only warns when the legacy CLIO_EVAL_RUNNER_STDOUT_FILE spelling is set.
  - name: CLIO_CODER_FORCE_COMPACT
    kind: env
    owner: interactive
    default: off
    controls: Exactly `1` on the interactive process forces the pre-submit compaction to run on every turn while set, regardless of the context threshold.
    verdict: keep
    note: docs said it forces compaction on the next interactive turn; the read at chat-loop.ts:1081 happens every turn, so it forces every turn while the variable stays set.
  - name: CLIO_CODER_GIT_COMMITS_ENABLED
    kind: env
    owner: core
    default: unset (in-process reads treat it as enabled; the hook requires exactly `1`)
    controls: Set by Clio to `1`/`0` from `integrations.git.commitAttribution` for itself and child seams; the managed hook exits unless it is exactly `1`, while absent counts as enabled in process.
    precedence: "`integrations.git.commitAttribution` writes it; env is the transport, not an operator override"
    verdict: keep
  - name: CLIO_CODER_GIT_CONFIG_BASE_COUNT
    kind: env
    owner: core
    default: unset
    controls: Set by Clio to the `GIT_CONFIG_COUNT` value before it appended its `core.hooksPath` pair; the hook wrapper and nested seams use it to strip only that pair.
    verdict: keep
  - name: CLIO_CODER_GIT_DEFAULT_HOOKS_EQUIVALENT
    kind: env
    owner: core
    default: unset
    controls: Set by Clio to the repository's explicitly configured `core.hooksPath` when it equals the default hooks directory, so the hook wrapper can chain the repo's own hook.
    verdict: keep
  - name: CLIO_CODER_HOME
    kind: env
    owner: core
    default: unset
    controls: Single-tree install root; each role resolves to `<home>/<config|data|state|cache>` unless its per-role `CLIO_CODER_*_DIR` variable is set.
    precedence: "`CLIO_CODER_<ROLE>_DIR` > `CLIO_CODER_HOME/<role>` > XDG or platform default"
    verdict: keep
  - name: CLIO_CODER_HOOK_BUDGET_<PHASE>_MS
    kind: env
    owner: middleware
    default: per-phase built-ins (before_tool 25, after_tool 25, turn_start 50, turn_end 75, on_compaction 150 ms)
    controls: Positive milliseconds budget for one middleware phase (`BEFORE_TOOL`, `AFTER_TOOL`, `TURN_START`, `TURN_END`, `ON_COMPACTION`); beats the global variable for that phase.
    precedence: "`CLIO_CODER_HOOK_BUDGET_<PHASE>_MS` > `CLIO_CODER_HOOK_BUDGET_MS` > built-in per-phase default"
    verdict: keep
    pattern: ^CLIO_CODER_HOOK_BUDGET_([A-Z_]+_MS)?$
  - name: CLIO_CODER_HOOK_BUDGET_DEBUG
    kind: env
    owner: middleware
    default: off
    controls: Exactly `1` prints every post-warmup hook-budget overrun to stderr instead of only steady-state slowness.
    verdict: keep
  - name: CLIO_CODER_HOOK_BUDGET_MS
    kind: env
    owner: middleware
    default: per-phase built-ins (before_tool 25, after_tool 25, turn_start 50, turn_end 75, on_compaction 150 ms)
    controls: Positive milliseconds applied to every middleware phase that has no per-phase override; invalid or non-positive values are ignored.
    precedence: "`CLIO_CODER_HOOK_BUDGET_<PHASE>_MS` > `CLIO_CODER_HOOK_BUDGET_MS` > built-in per-phase default"
    verdict: keep
  - name: CLIO_CODER_HOOK_BUDGET_THRESHOLD
    kind: env
    owner: middleware
    default: "3"
    controls: Positive integer count of overruns within the rolling window that triggers a steady-state slow-hook warning.
    verdict: keep
  - name: CLIO_CODER_HOOK_BUDGET_WARMUP_CALLS
    kind: env
    owner: middleware
    default: "1"
    controls: Non-negative integer number of initial calls per registration and phase that are exempt from budget accounting.
    verdict: keep
  - name: CLIO_CODER_HOOK_BUDGET_WINDOW
    kind: env
    owner: middleware
    default: "5"
    controls: Positive integer size of the rolling post-warmup call window examined for steady-state hook slowness.
    verdict: keep
  - name: CLIO_CODER_INJECTED_COMPILE_CACHE
    kind: env
    owner: cli
    default: unset
    controls: Set by the native worker spawn beside an injected `NODE_COMPILE_CACHE`; the worker entry deletes both when they match, and the `worker` subcommand strips a foreign marker.
    verdict: keep
  - name: CLIO_CODER_INSTANT_SHELL
    kind: env
    owner: interactive
    default: on
    controls: Exactly `0` disables the Stage 0 instant interactive shell mounted before service hydration; any other value or unset keeps it on.
    verdict: keep
  - name: CLIO_CODER_INTERACTIVE
    kind: env
    owner: cli
    default: unset (Clio sets `1` itself when stdin is a TTY)
    controls: Exactly `1` marks and forces the interactive TUI; Clio sets it when stdin is a TTY, any other value suppresses the TUI, and bash-tool children never inherit it.
    verdict: keep
  - name: CLIO_CODER_INTERNAL_DISPATCH_TIMEOUT_MS
    kind: env
    owner: core
    default: "900000"
    controls: Positive integer wall-clock cap in ms for one internal generator dispatch (wiki documenter, bootstrap scout), consumed by src/cli/internal-dispatch.ts.
    precedence: env > `fleet.limits.internalRunTimeoutMs` > built-in default
    verdict: keep
  - name: CLIO_CODER_LEGACY_MASK
    kind: env
    owner: interactive
    default: off
    controls: Exactly `1` re-enables the destructive stale-observation mask stage before summary compaction; a one-release compatibility escape hatch.
    verdict: keep
  - name: CLIO_CODER_LMSTUDIO_CORESIDENT_CONTEXT
    kind: env
    owner: engine
    default: "131072"
    controls: Positive integer ceiling on the context length requested when loading an LM Studio model next to another resident model; `off`, `0`, or `false` disables the clamp.
    verdict: keep
  - name: CLIO_CODER_MAX_DISPATCH_RUNS
    kind: env
    owner: core
    default: "1000"
    controls: Positive integer retention cap for the dispatch run ledger written by src/domains/dispatch/state.ts; the legacy `CLIO_CODER_MAX_RUNS` spelling reads when this is unset or invalid.
    precedence: env > `CLIO_CODER_MAX_RUNS` > `fleet.history.maxRuns` > built-in default
    verdict: keep
  - name: CLIO_CODER_MAX_RUNS
    kind: env
    owner: core
    default: "1000"
    controls: Legacy spelling of `CLIO_CODER_MAX_DISPATCH_RUNS`, consulted only when the canonical variable is unset or invalid; same positive integer semantics.
    precedence: "`CLIO_CODER_MAX_DISPATCH_RUNS` > env > `fleet.history.maxRuns` > built-in default"
    verdict: deprecate
    mergeWith: CLIO_CODER_MAX_DISPATCH_RUNS
    note: Read only when the canonical name is unset; src/core/guardrails.ts emits one CLIO_CODER_DEPRECATED_ENV warning per process when it is used.
  - name: CLIO_CODER_MEMORY_TRACE
    kind: env
    owner: memory
    default: off
    controls: File path for a JSONL trace of proactive task-memory step envelopes including up to 8000 chars of model text per step; off when unset or empty.
    verdict: keep
    note: The previous default value `conversation text` was the docs table's Contents column, not a default.
  - name: CLIO_CODER_MODEL_CATALOG_DIRS
    kind: env
    owner: providers
    default: unset
    controls: PATH-delimited list of extra model-catalog overlay directories, applied after the user and project overlays with the highest precedence.
    verdict: keep
  - name: CLIO_CODER_NO_NETWORK_TOOLS
    kind: env
    owner: tools
    default: off
    controls: Exactly `1` removes the network (RETRIEVE) tools from every registry built in the process; `clio-coder skills-eval` sets it for hermetic arms and `--allow-network` deletes it.
    precedence: "`skills-eval --allow-network` clears it for child arms; otherwise env only"
    verdict: keep
  - name: CLIO_CODER_OBSERVATION_TURN_BUDGET_BYTES
    kind: env
    owner: core
    default: "196608"
    controls: Positive integer byte pool shared by all observation-producing tools in one turn, floored at a minimum slice by src/tools/observation.ts.
    precedence: env > `safety.limits.observationBytesPerTurn` > built-in default
    verdict: keep
  - name: CLIO_CODER_PACKAGE_ROOT
    kind: env
    owner: core
    default: auto-detected
    controls: Path used as the package root for bundled assets and docs instead of walking up to package.json; the docs engine re-reads it live, other callers cache the first answer.
    verdict: keep
  - name: CLIO_CODER_READ_MAX_BYTES
    kind: env
    owner: core
    default: "51200"
    controls: Positive integer per-call byte cap for the read tool, floored at 1024 by src/tools/read.ts.
    precedence: env > `safety.limits.readBytesPerCall` > built-in default
    verdict: keep
  - name: CLIO_CODER_REDUCE_MOTION
    kind: env
    owner: interactive
    default: off
    controls: Exactly `1` makes smooth-streaming `auto` use the immediate coalescer; explicit `on` is unaffected.
    verdict: keep
  - name: CLIO_CODER_RENDER_TRACE
    kind: env
    owner: interactive
    default: off
    controls: File path for the versioned JSONL render-pipeline trace (timing only, no conversation text), truncated on open; off when unset or empty.
    verdict: keep
    note: The previous default value `timing only` was the docs table's Contents column, not a default.
  - name: CLIO_CODER_REQUIRE_HOME_PREFIX
    kind: env
    owner: core
    default: off
    controls: Exactly `1` aborts startup when any resolved Clio directory lies outside `CLIO_CODER_HOME`; a test-harness guardrail that does nothing when `CLIO_CODER_HOME` is unset.
    verdict: keep
  - name: CLIO_CODER_RESIDENCY
    kind: env
    owner: engine
    default: managed
    controls: "`observe`, `off`, `0`, `false`, `user`, or `user-managed` stops Clio managing model residency on every local runtime path; any other value or unset keeps management on."
    precedence: "either env or a target's `targets.<id>.lifecycle: user-managed` forces observe-only; neither re-enables; built-in managed"
    verdict: keep
    note: docs list only `observe`/`off`; code also accepts `0`, `false`, `user`, `user-managed`. src/domains/dispatch/transport.ts:109 exports `CLIO_CODER_RESIDENCY=<node.residency or observe>` to SSH workers.
  - name: CLIO_CODER_RIGOR
    kind: env
    owner: dispatch
    default: repo-derived
    controls: "`high` or `normal` (case-insensitive) overrides the finish-contract evidence bar for the orchestrator and dispatched workers; any other value means no override."
    precedence: env > workspace validation contract file (`.clio-coder/validation.yaml`, `validation.yaml`, `VALIDATION.md` raise it to `high`) > `normal`; no settings key
    verdict: keep
  - name: CLIO_CODER_RUN_JOURNAL
    kind: env
    owner: dispatch
    default: settings value (`fleet.history.journal`, built-in on)
    controls: "`1`/`true`/`on` or `0`/`false`/`off` turns the per-run NDJSON event journal under the state root on or off for this process; other values fall through."
    precedence: env > `fleet.history.journal` > built-in on
    verdict: keep
    note: No page under docs/ mentions it. The hygiene scanner misses it because the constant is named RUN_EVENT_JOURNAL_ENV_VAR rather than *_ENV. The source comment at run-event-journal.ts:122 still calls the setting `panes.journal`, which config.ts:694 maps to `fleet.history.journal`.
  - name: CLIO_CODER_RUN_OVERRIDES
    kind: env
    owner: core
    default: unset
    controls: JSON object (`maxContextTokens`, `kvCacheMode`, `sampling`) that `clio-coder run` and print modes write via `withRunOverrides` for the run's scope; workers inherit it and malformed input is dropped.
    verdict: keep
  - name: CLIO_CODER_SCREEN_READER
    kind: env
    owner: interactive
    default: off
    controls: Exactly `1` makes smooth-streaming `auto` use the immediate coalescer so a screen reader gets the low-motion update behavior; explicit `on` is unaffected.
    verdict: keep
  - name: CLIO_CODER_SHUTDOWN_HOOK_MS
    kind: env
    owner: core
    default: "500"
    controls: Positive integer milliseconds each shutdown and domain `stop()` hook may run before the coordinator moves on; non-positive or unparsable values use the default.
    verdict: keep
  - name: CLIO_CODER_SKILL_CATALOG_DIR
    kind: env
    owner: resources
    default: unset
    controls: Path to a local skill catalog used by the marketplace and the provenance pin manifest; beats `<cwd>/skills` and the packaged catalog but not an explicit catalogDir option.
    precedence: explicit catalogDir option > env > `<cwd>/skills` > packaged catalog
    verdict: keep
  - name: CLIO_CODER_SKILL_MARKETPLACE_INDEX
    kind: env
    owner: resources
    default: unset
    controls: Path to a skill-marketplace index file consulted after the catalog; an explicit indexPath option beats it and the built-in index path is the fallback.
    precedence: explicit indexPath option > env > default index path
    verdict: keep
  - name: CLIO_CODER_SMOOTH_STREAM
    kind: env
    owner: interactive
    default: settings value (built-in `off`)
    controls: "Per-process override for `interface.smoothStreaming`: `0`/`off`/`false`, `auto`, or `1`/`on`/`true`; any other non-empty value fails safe to `off`."
    precedence: env (any non-empty value) > `interface.smoothStreaming` > built-in `off`
    verdict: keep
  - name: CLIO_CODER_STATE_DIR
    kind: env
    owner: cli
    default: platform default (`$XDG_STATE_HOME/clio-coder`, else `~/.local/state/clio-coder`)
    controls: Absolute path for the state root; beats `CLIO_CODER_HOME/state` and the platform default, and the fleet-view pane child re-pins it from argv.
    precedence: env > `CLIO_CODER_HOME/state` > `XDG_STATE_HOME` or platform default
    verdict: keep
  - name: CLIO_CODER_STATUS_STUCK_MS
    kind: env
    owner: interactive
    default: "180000"
    controls: Positive number of milliseconds of elapsed turn time after which the status watchdog reports the turn as stuck (tier 4).
    verdict: keep
  - name: CLIO_CODER_SYNTHESIS_LOCK
    kind: env
    owner: engine
    default: strip
    controls: "`tool-choice` keeps tool schemas and sends `tool_choice: none` on a synthesis-locked worker round for OpenAI-family runtimes; any other value strips the schemas."
    verdict: keep
  - name: CLIO_CODER_TEST_STAGE1_DELAY_MS
    kind: env
    owner: cli
    default: "0"
    controls: Under `NODE_ENV=test` only, integer milliseconds (clamped to 0..5000) to sleep between the Stage 0 shell mount and Stage 1 hydration for PTY tests.
    verdict: keep
  - name: CLIO_CODER_TEST_STAGE1_FAIL
    kind: env
    owner: cli
    default: off
    controls: Under `NODE_ENV=test` only, exactly `1` throws an injected Stage 1 hydration failure after the instant shell mounts.
    verdict: keep
  - name: CLIO_CODER_TEST_UPGRADE_NO_NETWORK
    kind: env
    owner: cli
    default: off
    controls: Any non-empty value makes `clio-coder upgrade` skip the npm install step so upgrade tests run offline.
    verdict: keep
  - name: CLIO_CODER_TIMING
    kind: env
    owner: core
    default: off
    controls: Exactly `1` prints the startup timer report after the banner, but only on the bannered non-interactive boot (not the TUI, headless, or ACP paths).
    verdict: keep
    note: docs describe a startup timing report without saying it prints only on the non-interactive bannered boot (src/entry/orchestrator.ts:946-949).
  - name: CLIO_CODER_TRACE_BOOT
    kind: env
    owner: core
    default: off
    controls: Exactly `1` writes a `[clio-coder:boot] +<ms> <phase>` line to stderr for every boot phase marker, including startup-timer marks.
    verdict: keep
  - name: CLIO_CODER_TRACE_MAX_BYTES
    kind: env
    owner: observability
    default: "134217728"
    controls: Integer of at least 1048576 bytes the SQLite trace mirror may occupy before the oldest terminal runs are pruned; smaller or invalid values fall back.
    precedence: env > built-in default (no settings key)
    verdict: keep
  - name: CLIO_CODER_TRACE_RETENTION_DAYS
    kind: env
    owner: observability
    default: "30"
    controls: Integer of at least 1 giving the maximum age in days of terminal rows kept in the SQLite trace mirror; invalid values fall back.
    precedence: env > built-in default (no settings key)
    verdict: keep
  - name: CLIO_CODER_TRUST_PROJECT_RESOURCES
    kind: env
    owner: resources
    default: settings value (built-in false)
    controls: Exactly `1` trusts third-party project resource imports (skills and prompts) for this process; it can only enable, never disable, what the setting says.
    precedence: "`integrations.projectResources.trustProjectImports: true` > env `1` > `CLIO_CODER_TRUST_PROJECT_SKILLS=1` > off; each layer only enables"
    verdict: keep
    note: docs said `1` overrides the setting; in code (loader.ts:222-224) an explicit true setting wins first and env cannot turn trust off.
  - name: CLIO_CODER_TRUST_PROJECT_SKILLS
    kind: env
    owner: resources
    default: off
    controls: Deprecated alias of `CLIO_CODER_TRUST_PROJECT_RESOURCES`; exactly `1` still trusts project resource imports and emits one `CLIO_CODER_DEPRECATED_ENV` warning.
    verdict: deprecate
    mergeWith: CLIO_CODER_TRUST_PROJECT_RESOURCES
  - name: CLIO_CODER_TURN_TOOL_CALL_BUDGET
    kind: env
    owner: core
    default: "60"
    controls: Positive integer soft per-turn tool-call budget for the orchestrator, consumed by src/engine/loop-guard.ts; the hard interrupt ceiling sits 15 calls above it.
    precedence: env > `safety.limits.chatToolCallsPerTurn` > built-in default
    verdict: keep
  - name: CLIO_CODER_WORKER_FAUX
    kind: env
    owner: engine
    default: off
    controls: Exactly `1` registers the pi-ai faux provider and queues one deterministic assistant reply so a worker subprocess runs end to end without credentials (tests only).
    verdict: keep
  - name: CLIO_CODER_WORKER_FAUX_ERROR_MESSAGE
    kind: env
    owner: engine
    default: unset
    controls: Optional assistant `errorMessage` attached to the faux worker reply when `CLIO_CODER_WORKER_FAUX=1`; empty means no error.
    verdict: document
    note: docs carry it only as the `+ _ERROR_MESSAGE` suffix shorthand on the CLIO_CODER_WORKER_FAUX row; the hygiene scanner accepts that shorthand.
  - name: CLIO_CODER_WORKER_FAUX_MODEL
    kind: env
    owner: engine
    default: faux-model
    controls: Model id registered under the faux provider when `CLIO_CODER_WORKER_FAUX=1`.
    verdict: document
    note: docs carry it only as the `+ _MODEL` suffix shorthand on the CLIO_CODER_WORKER_FAUX row; the hygiene scanner accepts that shorthand.
  - name: CLIO_CODER_WORKER_FAUX_STOP_REASON
    kind: env
    owner: engine
    default: stop
    controls: Assistant `stopReason` of the faux reply when `CLIO_CODER_WORKER_FAUX=1`, cast unchecked to the engine stop-reason type.
    verdict: document
    note: docs carry it only as the `+ _STOP_REASON` suffix shorthand on the CLIO_CODER_WORKER_FAUX row; the hygiene scanner accepts that shorthand.
  - name: CLIO_CODER_WORKER_FAUX_TEXT
    kind: env
    owner: engine
    default: ok
    controls: Assistant response text of the faux reply when `CLIO_CODER_WORKER_FAUX=1`.
    verdict: document
    note: docs carry it only as the `+ _TEXT` suffix shorthand on the CLIO_CODER_WORKER_FAUX row; the hygiene scanner accepts that shorthand.
  - name: CLIO_CODER_WORKER_LABELS
    kind: env
    owner: worker
    default: unset (no labels)
    controls: Set by the SSH transport from the node's configured `labels`; the worker entry splits the comma-separated list and attests it on the control lane.
    verdict: keep
  - name: CLIO_CODER_WORKER_PGID
    kind: env
    owner: worker
    default: worker's own pid (null on Windows)
    controls: Set by the SSH transport to the login shell's pid (`$$`); the worker entry announces it as the process group an abort must signal, else its own pid.
    verdict: keep
  - name: CLIO_CODER_WORKER_RUN
    kind: env
    owner: resources
    default: unset
    controls: "Set to `1` by the worker entry on itself so every child sees it; `installSkillFromSource` stamps `installed-by: worker` when it is exactly `1`."
    verdict: keep
  - name: CLIO_CODER_WORKER_TOOL_CALL_CAP
    kind: env
    owner: core
    default: "150"
    controls: Positive integer lifetime cap on admitted tool calls per dispatched worker; recipe budgets may narrow it and refused calls never spend it.
    precedence: env > `fleet.limits.toolCallsPerRun` > built-in default (same order in guardrails.ts and dispatch/extension.ts:1607)
    verdict: keep
  - name: CLIO_CODER_YAZI_PICK_TOKEN
    kind: env
    owner: cli
    default: unset
    controls: Set by the Yazi companion session to a random UUID (both spellings) in Yazi's env; the generated keymap expands `$CLIO_CODER_YAZI_PICK_TOKEN` into the pick event Clio matches.
    verdict: keep
    note: No page under docs/ mentions it. The hygiene scanner misses it (string argument to namingCompatibilityEnvironment). src/cli/doctor-naming.ts:37 only warns when the legacy CLIO_YAZI_PICK_TOKEN spelling is set.
  - name: COLORTERM
    kind: env
    owner: interactive
    default: unset
    controls: A value containing `truecolor` or `24bit` switches the theme to 24-bit SGR colors; otherwise 256-color codes are used unless `TERM` says truecolor.
    verdict: keep
  - name: COLUMNS
    kind: env
    owner: cli
    default: "80"
    controls: When stdout is not a TTY, a positive number sets the table width for CLI listings (minimum 20); the TTY width wins when present and 80 is the fallback.
    verdict: document
  - name: EDITOR
    kind: env
    owner: interactive
    default: first of `nano`, `vi` on PATH
    controls: External editor command for the TUI editor handoff, used when `VISUAL` is unset; falls back to the first of `nano` or `vi` found on PATH.
    precedence: "`VISUAL` > `EDITOR` > `nano` > `vi`"
    verdict: keep
  - name: GIT_CONFIG_COUNT
    kind: env
    owner: core
    default: unset (treated as 0)
    controls: Git's config-entry count; Clio appends its `core.hooksPath` pair at that index (skipping attribution when invalid or above 1024) and nested seams restore it.
    verdict: keep
  - name: HERDR_ENV
    kind: env
    owner: mux
    default: unset
    controls: Must be exactly `1` for Clio to treat itself as running inside a herdr pane host; otherwise pane detection reports none.
    precedence: "`interface.panes.enabled` gates the probe first; then env"
    verdict: keep
  - name: HERDR_SESSION
    kind: env
    owner: mux
    default: unset
    controls: Names the herdr session whose socket (`<herdr config>/sessions/<id>/herdr.sock`) is tried after `HERDR_SOCKET_PATH` and before the global socket.
    verdict: document
  - name: HERDR_SOCKET_PATH
    kind: env
    owner: mux
    default: unset
    controls: Explicit herdr socket path tried first when connecting to the pane host.
    verdict: document
  - name: HOME
    kind: env
    owner: eval
    default: unset (os.homedir() where a fallback exists)
    controls: Home directory used to strip the home prefix from eval artifacts, to collapse displayed paths to `~`, and as the herdr config base when `XDG_CONFIG_HOME` is unset.
    verdict: keep
  - name: LOCALAPPDATA
    kind: env
    owner: core
    default: ~\AppData\Local
    controls: Windows-only base directory for the state and cache roots (`%LOCALAPPDATA%\clio-coder\state`, `%LOCALAPPDATA%\clio-coder\cache`); ignored on other platforms.
    verdict: keep
  - name: LOGNAME
    kind: env
    owner: dispatch
    default: unknown
    controls: Fallback user name for run identity when `os.userInfo()` throws and `USER` is empty; otherwise `unknown`.
    verdict: document
  - name: LSB_JOBID
    kind: env
    owner: dispatch
    default: unset
    controls: "Non-empty value records an LSF job in the run identity (`scheduler: lsf`), checked after the SLURM and PBS job ids."
    verdict: document
  - name: LSB_JOBNAME
    kind: env
    owner: dispatch
    default: unset
    controls: Job name recorded beside `LSB_JOBID` in the LSF run identity; ignored without it.
    verdict: document
  - name: LSF_CLUSTER_NAME
    kind: env
    owner: dispatch
    default: unset
    controls: Cluster name recorded beside `LSB_JOBID` in the LSF run identity; ignored without it.
    verdict: document
  - name: NO_COLOR
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value drops every foreground and background SGR color from the theme; bold, dim, italic, and underline stay.
    verdict: keep
  - name: NODE_COMPILE_CACHE
    kind: env
    owner: core
    default: unset (Clio uses `<cache>/v8-compile-cache` once the cache root exists)
    controls: "Presence (even empty) means the operator owns the V8 compile cache: Clio calls `enableCompileCache()` with no directory and never injects its own cache into workers."
    verdict: keep
  - name: NODE_DISABLE_COMPILE_CACHE
    kind: env
    owner: core
    default: unset
    controls: Presence disables Clio's compile cache for this process and stops the worker spawn from injecting one.
    verdict: keep
  - name: NODE_ENV
    kind: env
    owner: cli
    default: unset
    controls: Exactly `test` unlocks the Stage 1 interleaving seams (`CLIO_CODER_TEST_STAGE1_DELAY_MS`, `CLIO_CODER_TEST_STAGE1_FAIL`); no other value matters.
    verdict: keep
  - name: NODE_OPTIONS
    kind: env
    owner: observability
    default: unset
    controls: Scanned for `--trace-warnings`; when present, the trace store stops suppressing Node's `node:sqlite` ExperimentalWarning.
    verdict: document
  - name: OLLAMA_NUM_PARALLEL
    kind: env
    owner: providers
    default: "1"
    controls: Positive integer parallel slot count assumed for a local Ollama server during discovery; anything else counts as 1.
    verdict: keep
  - name: PATH
    kind: env
    owner: cli
    default: unset
    controls: Searched for executables by interop CLI detection, toolchain resolution, the uninstall shadow check, and editor probing; the bash tool's login-env capture is discarded without it.
    verdict: keep
  - name: PBS_JOBID
    kind: env
    owner: dispatch
    default: unset
    controls: "Non-empty value records a PBS job in the run identity (`scheduler: pbs`), checked after the SLURM id and before LSF."
    verdict: document
  - name: PBS_JOBNAME
    kind: env
    owner: dispatch
    default: unset
    controls: Job name recorded beside `PBS_JOBID` in the PBS run identity; ignored without it.
    verdict: document
  - name: PBS_O_HOST
    kind: env
    owner: dispatch
    default: unset
    controls: Submission host recorded as the cluster beside `PBS_JOBID` in the PBS run identity; ignored without it.
    verdict: document
  - name: SHELL
    kind: env
    owner: core
    default: /bin/sh
    controls: Shell run with `-lc` for the external editor command and for shell-expanded config values on POSIX; defaults to `/bin/sh` (Windows uses `ComSpec`).
    verdict: document
  - name: SLURM_CLUSTER_NAME
    kind: env
    owner: dispatch
    default: unset
    controls: Cluster name recorded beside `SLURM_JOB_ID` in the SLURM run identity; ignored without it.
    verdict: document
  - name: SLURM_JOB_ID
    kind: env
    owner: dispatch
    default: unset
    controls: "Non-empty value records a SLURM job in the run identity (`scheduler: slurm`); it takes priority over the PBS and LSF ids."
    verdict: document
  - name: SLURM_JOB_NAME
    kind: env
    owner: dispatch
    default: unset
    controls: Job name recorded beside `SLURM_JOB_ID` in the SLURM run identity; ignored without it.
    verdict: document
  - name: SSH_CONNECTION
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value marks a remote session and makes smooth-streaming `auto` use the immediate coalescer.
    verdict: document
  - name: SSH_TTY
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value marks a remote TTY and makes smooth-streaming `auto` use the immediate coalescer.
    verdict: document
  - name: STY
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value (GNU screen) makes smooth-streaming `auto` use the immediate coalescer.
    verdict: document
  - name: TERM
    kind: env
    owner: interactive
    default: unset
    controls: Empty, `dumb`, or `unknown` disables smooth-streaming `auto`; a value containing `truecolor` or `24bit` enables 24-bit theme colors.
    verdict: keep
  - name: TERM_PROGRAM
    kind: env
    owner: interactive
    default: unset
    controls: Terminal program name; `WezTerm`, `iTerm.app`, and Windows Terminal (with `WT_SESSION`) route desktop notifications through OSC 9 (src/interactive/footer/notifications.ts).
    verdict: document
  - name: TMUX
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value (inside tmux) makes smooth-streaming `auto` use the immediate coalescer.
    verdict: document
  - name: TZ
    kind: env
    owner: safety
    default: unset (system zone)
    controls: Time zone used to name the local-date audit log file; the formatter is rebuilt whenever the value changes mid-process.
    verdict: keep
  - name: USER
    kind: env
    owner: dispatch
    default: unknown
    controls: Fallback user name for run identity when `os.userInfo()` throws, checked before `LOGNAME`; otherwise `unknown`.
    verdict: document
  - name: VISUAL
    kind: env
    owner: interactive
    default: unset
    controls: Preferred external editor command for the TUI editor handoff, checked before `EDITOR`.
    precedence: "`VISUAL` > `EDITOR` > `nano` > `vi`"
    verdict: document
  - name: WT_SESSION
    kind: env
    owner: interactive
    default: unset
    controls: Any non-empty value (Windows Terminal) routes desktop notifications to OSC 9 instead of OSC 777.
    verdict: keep
  - name: XDG_CACHE_HOME
    kind: env
    owner: core
    default: ~/.cache
    controls: Linux base for the default cache root (`$XDG_CACHE_HOME/clio-coder`) when neither `CLIO_CODER_CACHE_DIR` nor `CLIO_CODER_HOME` is set.
    verdict: document
  - name: XDG_CONFIG_HOME
    kind: env
    owner: core
    default: ~/.config
    controls: Linux base for the default config root, the herdr config directory, and (when absolute) the user's own Yazi config directory.
    verdict: document
  - name: XDG_DATA_HOME
    kind: env
    owner: core
    default: ~/.local/share
    controls: Linux base for the default data root (`$XDG_DATA_HOME/clio-coder`) when neither `CLIO_CODER_DATA_DIR` nor `CLIO_CODER_HOME` is set.
    verdict: document
  - name: XDG_STATE_HOME
    kind: env
    owner: core
    default: ~/.local/state
    controls: Linux base for the default state root (`$XDG_STATE_HOME/clio-coder`) when neither `CLIO_CODER_STATE_DIR` nor `CLIO_CODER_HOME` is set.
    verdict: document
  - name: chat.maxOutputTokens
    kind: setting
    owner: chat
    default: "32768"
    controls: Global output-token budget requested on every chat turn (integer >= 0, `0` means per-model caps only); clamped to the model's max-output cap and remaining context window; applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.model
    kind: setting
    owner: chat
    default: "null"
    controls: Saved default chat model id (string or null); null with a target set rebases to that target's `defaultModel` at validation; applies next session.
    precedence: "`run --model` > session routing (`/model`, `/thinking`, Alt+J/K, `/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default"
    verdict: keep
  - name: chat.modelPicker.cycleSet
    kind: setting
    owner: chat
    default: "[]"
    controls: Exact `target` or `target/model` refs Alt+J/Alt+K cycle through (refs with an empty target part are dropped); session-owned routing state, immediate this session, saved default next session.
    precedence: session routing (Alt+J/K, `/settings`) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.modelPicker.favorites
    kind: setting
    owner: chat
    default: "[]"
    controls: Exact `target/model` refs pinned in the focused model picker; refs naming an unconfigured target are dropped at validation; applies immediately.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.modelPicker.recentLimit
    kind: setting
    owner: chat
    default: "12"
    controls: How many recently selected `target/model` refs `recent-models.json` keeps (integer >= 1); applies immediately.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.prewarm
    kind: setting
    owner: chat
    default: "true"
    controls: Whether the known prompt prefix is sent to a `local-native` server at session start, after resume, and after compaction to fill its prefix cache (boolean; no effect on other tiers, workers, headless); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.retry.baseDelayMs
    kind: setting
    owner: chat
    default: "2000"
    controls: First backoff delay in ms for chat-loop retries, doubled per attempt up to `maxDelayMs` (integer >= 0); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.retry.enabled
    kind: setting
    owner: chat
    default: "true"
    controls: Master switch for transient-provider retries in the interactive chat loop (boolean); dispatched workers use `fleet.retry.maxRetries` instead; applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.retry.maxDelayMs
    kind: setting
    owner: chat
    default: "60000"
    controls: Ceiling in ms on the exponential backoff between chat-loop retries (integer >= 0); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.retry.maxRetries
    kind: setting
    owner: chat
    default: "3"
    controls: Maximum retry attempts for one transient provider failure in the chat loop (integer >= 0); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.retry.streamStallMs
    kind: setting
    owner: chat
    default: "180000"
    controls: Silence on an in-flight stream longer than this many ms is treated as a wedged backend and the turn is aborted and retried (integer >= 0, `0` disables the stall timer); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: chat.target
    kind: setting
    owner: chat
    default: "null"
    controls: Saved default chat target id (configured id or null); a dangling id normalizes to null and clears `chat.model`; seeds session routing at launch, so applies next session.
    precedence: "`run --target` > session routing (`/model`, `/thinking`, Alt+J/K, `/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default"
    verdict: keep
  - name: chat.thinkingLevel
    kind: setting
    owner: chat
    default: off
    controls: "Saved default reasoning effort for the chat model: `off`, `minimal`, `low`, `medium`, `high`, `xhigh`, `max`, clamped to what the model supports at request time; applies next session."
    precedence: "`run --thinking` > session routing (`/model`, `/thinking`, Alt+J/K, `/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default"
    verdict: keep
  - name: context.compaction.auto
    kind: setting
    owner: context
    default: "true"
    controls: Master switch for the pre-request compaction trigger when context pressure crosses `threshold` (boolean); manual `/context compact` still works when off; applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.compaction.model
    kind: setting
    owner: context
    controls: Optional `provider/model` pattern resolved for the summary model when compaction runs; absent means the chat target summarizes; applies next turn.
    verdict: keep
  - name: context.compaction.systemPrompt
    kind: setting
    owner: context
    controls: Optional path to a prompt-override file read at compaction time to replace the built-in summary prompt; applies next turn.
    verdict: keep
  - name: context.compaction.threshold
    kind: setting
    owner: context
    default: "0.8"
    controls: Context pressure (estimated tokens over the context window, 0 through 1) at which eviction and then LLM summary compaction run; applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.cadenceToolCalls
    kind: setting
    owner: context
    default: "10"
    controls: Tool calls between proactive memory interventions inside a turn (integer >= 2); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.enabled
    kind: setting
    owner: context
    default: "true"
    controls: Master switch for proactive memory intervention during a turn (boolean); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.maxOutputTokens
    kind: setting
    owner: context
    default: "2000"
    controls: Output-token cap for one memory model call (integer >= 1); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.model
    kind: setting
    owner: context
    default: "null"
    controls: Model id for the background memory model (string or null); null rebases to the target's `defaultModel`; session routing state, applies next turn.
    precedence: session routing (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.target
    kind: setting
    owner: context
    default: "null"
    controls: Target id for the background memory model (configured id or null); null means deterministic rules-only memory; session routing state, applies next turn.
    precedence: session routing (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.timeoutMs
    kind: setting
    owner: context
    default: "60000"
    controls: Timeout in ms for one memory model call (integer >= 1); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.memory.trajectorySteps
    kind: setting
    owner: context
    default: "8"
    controls: Recent trajectory steps handed to the memory model per intervention (integer >= 1); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.workingSet.enabled
    kind: setting
    owner: context
    default: "true"
    controls: Master switch for working-set eviction of stale tool results and thinking before summary compaction (boolean); off goes straight to summary compaction; applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.workingSet.minEvictableTokens
    kind: setting
    owner: context
    default: "200"
    controls: Tool results estimated below this many tokens are never evicted because the marker would cost more than it saves (integer >= 0); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.workingSet.policy
    kind: setting
    owner: context
    default: structural-v1
    controls: "Eviction candidate rule set: `structural-v1` or `age-horizon`; applies next turn."
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.workingSet.protectLastTurns
    kind: setting
    owner: context
    default: "6"
    controls: Most recent user turns whose observations are never evicted (integer >= 1); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: context.workingSet.target
    kind: setting
    owner: context
    default: "0.6"
    controls: Used/window ratio an applied eviction batch reduces context to (number > 0 and < 1); applies next turn.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: fleet.adaptiveRouting.agentRoles
    kind: setting
    owner: fleet
    default: "[]"
    controls: "Exact `{agentId, executionRole}` pairs for which an `agent: auto` request may swap agents (no cross-product, `auto` reserved, duplicate pairs rejected); applies next dispatch."
    verdict: keep
  - name: fleet.adaptiveRouting.agentRoles[].agentId
    kind: setting
    owner: fleet
    controls: Native agent id the pair authorizes for automatic agent selection; required, `auto` is reserved.
    verdict: keep
  - name: fleet.adaptiveRouting.agentRoles[].executionRole
    kind: setting
    owner: fleet
    controls: "Execution role of the pair: `builder`, `researcher`, `verifier`, `reviewer`, `judge`; required."
    verdict: keep
  - name: fleet.adaptiveRouting.postures
    kind: setting
    owner: fleet
    default: "[]"
    controls: Requested postures (`quality`, `balanced`, `latency`, `economy`) for which joint routing is active; both the role and the posture must be listed; applies next dispatch.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: fleet.adaptiveRouting.roles
    kind: setting
    owner: fleet
    default: "[]"
    controls: Execution roles (`researcher`, `verifier`, `reviewer`, `judge`) for which measured joint routing may change execution; unlisted roles only record a shadow recommendation; applies next dispatch.
    precedence: session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default
    verdict: keep
  - name: fleet.agentProfiles
    kind: setting
    owner: fleet
    default: "{}"
    controls: Map of native agent id to a `fleet.profiles` name so that agent's dispatches use that route (`auto` is reserved; ACP agents cannot be bound); applies next dispatch.
    precedence: "`run --target` > `run --agent-profile` > session override (`/settings` apply-this-session) > `.clio-coder/settings.local.yaml` > `.clio-coder/settings.yaml` > user settings.yaml > default"
    verdict: keep
  - name: fleet.agentProfiles.<key>
    kind: setting
    owner: fleet
