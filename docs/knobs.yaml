  - name: audience
    kind: recipe-key
    owner: agents
    controls: "Provenance enum `base | shadow | custom | internal`: builtin recipes name any but `custom`, discovered ones must say `custom`, and it decides catalog visibility and user-origin dispatch reachability."
    verdict: keep
  - name: budget
    kind: recipe-key
    owner: agents
    controls: Required strict worker-loop phase policy object with `toolCalls`, `readReserve`, `synthesis` and optional `maximum`; admission builds the WorkerSpec budget from it under the operator cap.
    verdict: keep
  - name: budget.maximum
    kind: recipe-key
    owner: agents
    controls: Optional `{toolCalls, readReserve}` ceiling at or above the default phase; when present a dispatch may request any phase within it, when absent the recipe pins the default exactly.
    verdict: keep
  - name: budget.maximum.readReserve
    kind: recipe-key
    owner: agents
    controls: Largest read reserve a dispatch or `retryRevision` may request; it must be at least `budget.readReserve` and below `maximum.toolCalls`.
    verdict: keep
  - name: budget.maximum.toolCalls
    kind: recipe-key
    owner: agents
    controls: Largest tool-call phase a dispatch or `retryRevision` may request; it must be at least `budget.toolCalls` and is still clamped by the operator cap.
    verdict: keep
  - name: budget.readReserve
    kind: recipe-key
    owner: agents
    controls: Tail of the admitted phase reserved for canonical `read` plus delivery tools; the loop guard blocks other tools once `toolCalls` minus `readReserve` calls are admitted, and it is zero without `read`.
    verdict: keep
  - name: budget.synthesis
    kind: recipe-key
    owner: agents
    controls: Boolean where `true` locks tools at the boundary and grants a text-only synthesis round, and `false` fails the run with `worker agent budget reached` at the boundary.
    verdict: keep
  - name: budget.toolCalls
    kind: recipe-key
    owner: agents
    controls: Admitted tool calls before the final-response phase (must be > 0); the loop guard uses it as the worker's soft limit and derives the loop-block budget from it.
    verdict: keep
  - name: capabilityClass
    kind: recipe-key
    owner: agents
    controls: Enum `read-only | artifact-write | workspace-edit | verification | orchestration | internal`; it is the authority a dispatch requests and approves and derives the default project-context tier.
    verdict: keep
  - name: category
    kind: recipe-key
    owner: agents
    controls: Enum `explore | plan | research | implement | quality | science | evolution | operations | internal` used to sort and label the catalog.
    verdict: keep
  - name: description
    kind: recipe-key
    owner: agents
    controls: Required non-empty string shown in the catalog and used to derive the fleet prompt purpose line.
    verdict: keep
  - name: latencyClass
    kind: recipe-key
    owner: agents
    controls: Enum `fast | balanced | deep` that sets the route prior when candidate agents are ranked for a dispatch.
    verdict: keep
  - name: name
    kind: recipe-key
    owner: agents
    controls: Required non-empty display name rendered in catalog and agent listings.
    verdict: keep
  - name: product
    kind: recipe-key
    owner: agents
    controls: Optional enum (only `orientation`) naming what the run delivers, which adds `code_nav` to the delivery tools admitted inside the read reserve; a misspelling is a parse error.
    verdict: keep
  - name: projectContextTier
    kind: recipe-key
    owner: agents
    controls: Enum `none | bounded`; `bounded` injects the capped project name/conventions/invariants projection as a dynamic message and `none` skips the CLIO-CODER.md read.
    verdict: keep
  - name: resultContract
    kind: recipe-key
    owner: agents
    controls: Required object naming the typed result shape the worker must return; the terminal output is validated and repaired against it.
    verdict: keep
  - name: resultContract.kind
    kind: recipe-key
    owner: agents
    controls: One of twelve recipe-declarable report kinds (`scout-report`, `mutation-report`, `delegation-plan`, ...) or `architect-plan`; `council-ballot` may only arrive as a coordinator override.
    verdict: keep
  - name: resultContract.path
    kind: recipe-key
    owner: agents
    controls: Workspace-relative plan file path required only by `architect-plan` and refused for any other kind; absolute or `..` paths are rejected.
    verdict: keep
  - name: skills
    kind: recipe-key
    owner: agents
    controls: Array of unique skill names bound to files at registry load; they inject knowledge into the prompt, require the `context` tool, and never widen tool authority.
    verdict: keep
  - name: tags
    kind: recipe-key
    owner: agents
    controls: Array of unique lowercase routing hints shown in the catalog and matched against task signals when ranking candidate agents.
    verdict: keep
  - name: tools
    kind: recipe-key
    owner: agents
    controls: "Object `{required, optional}` of unique tool names, where a required entry may be `{anyOf: [...]}`; a required tool that does not admit on the target makes the recipe unusable there."
    verdict: keep
  - name: version
    kind: recipe-key
    owner: agents
    controls: Recipe schema version; only the integer 1 is accepted.
    verdict: keep
  - name: description
    kind: fragment-key
    owner: prompts
    controls: Required non-empty string describing the fragment; the loader rejects a missing one and nothing downstream reads it.
    verdict: keep
  - name: dynamic
    kind: fragment-key
    owner: prompts
    controls: Optional boolean marking a fragment as dynamic (rendered as a per-session message rather than part of the stable system prompt); it must be a boolean when present.
    verdict: keep
  - name: id
    kind: fragment-key
    owner: prompts
    controls: Required dot-separated namespace id (`identity.clio`) the compiler looks fragments up by; a duplicate or non-matching id fails loading.
    verdict: keep
  - name: version
    kind: fragment-key
    owner: prompts
    controls: Fragment schema version; the loader accepts only the integer 1.
    verdict: keep
  - name: capabilities
    kind: model-tag
    owner: providers
    controls: Object of `CapabilityFlags` a knowledge-base entry contributes; it is merged over runtime defaults and under target overrides to build the synthesized model.
    verdict: keep
  - name: capabilities.audio
    kind: model-tag
    owner: providers
    controls: Boolean audio-input flag carried into CapabilityFlags for badges and dashboards; no request builder reads it.
    verdict: keep
  - name: capabilities.chat
    kind: model-tag
    owner: providers
    controls: Boolean saying the model serves chat; feeds runtime resolution and the `C` badge in `targets` and `models` output.
    verdict: keep
  - name: capabilities.contextWindow
    kind: model-tag
    owner: providers
    controls: Token context window of the synthesized model unless a probe or configured target value overrides it; drives compaction pressure and context-floor warnings.
    verdict: keep
  - name: capabilities.embeddings
    kind: model-tag
    owner: providers
    controls: Boolean embeddings flag carried into CapabilityFlags for the `E` badge and dashboards; no request builder reads it.
    verdict: keep
  - name: capabilities.fim
    kind: model-tag
    owner: providers
    controls: Boolean fill-in-the-middle flag for the `F` badge and dashboards; no request builder reads it.
    verdict: keep
  - name: capabilities.maxTokens
    kind: model-tag
    owner: providers
    controls: Default max output tokens of the synthesized model unless a probe or target override supplies one; bounds per-turn output and Anthropic-style thinking budgets.
    verdict: keep
  - name: capabilities.reasoning
    kind: model-tag
    owner: providers
    controls: Boolean that marks the synthesized model as reasoning-capable and, with `quirks.thinking.mechanism`, decides whether thinking fields are sent at all.
    verdict: keep
  - name: capabilities.rerank
    kind: model-tag
    owner: providers
    controls: Boolean rerank flag for the `K` badge and dashboards; no request builder reads it.
    verdict: keep
  - name: capabilities.structuredOutputs
    kind: model-tag
    owner: providers
    controls: Structured-output mode (`json-schema`, `gbnf`, `xgrammar`, `none`); only `json-schema` lets a dispatch `responseSchema` be enforced on the worker request.
    verdict: keep
  - name: capabilities.thinkingFormat
    kind: model-tag
    owner: providers
    controls: Thinking wire format (`qwen-chat-template`, `harmony`, `deepseek-r1`, ...) copied into the OpenAI compat block and used to infer the thinking mechanism when quirks omit one.
    verdict: keep
  - name: capabilities.toolCallFormat
    kind: model-tag
    owner: providers
    controls: Declared tool-call dialect (`openai`, `qwen`, `hermes`, ...) validated on targets and worker specs; no request builder currently branches on it.
    verdict: keep
  - name: capabilities.tools
    kind: model-tag
    owner: providers
    controls: Boolean tool-calling flag; `supportsTools` gates tool attachment and the `T` badge.
    verdict: keep
  - name: capabilities.vision
    kind: model-tag
    owner: providers
    controls: Boolean that sets the synthesized model's `input` to text plus image so image blocks are accepted.
    verdict: keep
  - name: family
    kind: model-tag
    owner: providers
    controls: Canonical family id; a pattern equal to it counts as a `family` match, and the id lands on `model.clioCoder.family`, where `openai-gpt-oss` selects Harmony handling.
    verdict: keep
  - name: matchPatterns
    kind: model-tag
    owner: providers
    controls: Lowercase substrings matched against the wire model id; the longest matching pattern across the whole knowledge base selects the entry.
    verdict: keep
  - name: quirks
    kind: model-tag
    owner: providers
    controls: Free-form object per entry; `extractLocalModelQuirks` narrows only `kvCache`, `sampling` and `thinking` into `model.clioCoder.quirks`, and every other key is provenance.
    verdict: keep
  - name: quirks.chatTemplate
    kind: model-tag
    owner: providers
    controls: Names the chat-template dialect (`gemma-channel`) a family uses; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.gpuTiers
    kind: model-tag
    owner: providers
    controls: Map of GPU memory tier (`32gb`) to a free-text serving recommendation; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.gpuTiers.<gpuTiers>
    kind: model-tag
    owner: providers
    controls: One tier's recommendation text keyed by memory class; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.kvCache
    kind: model-tag
    owner: providers
    controls: Typed KV-cache block extracted into `model.clioCoder.quirks.kvCache`; no request builder or server-start path reads the extracted value.
    verdict: keep
