    verdict: document
  - name: quirks.llamaCpp
    kind: model-tag
    owner: providers
    controls: Recommended llama.cpp server-start profile for the family; provenance only; nothing in src reads it (the probe reads the running server's argv instead).
    verdict: document
  - name: quirks.llamaCpp.batchSize
    kind: model-tag
    owner: providers
    controls: Recommended `--batch-size` for starting the server; provenance only; nothing in src reads it.
