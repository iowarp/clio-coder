    controls: Recommended `--cache-type-k` for starting the server; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.llamaCpp.cacheTypeV
    kind: model-tag
    owner: providers
    controls: Recommended `--cache-type-v` for starting the server; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.llamaCpp.chatTemplateKwargs
