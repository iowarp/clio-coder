    controls: "Recommended `--chat-template-kwargs` map for the server start (for example `enable_thinking: false`); provenance only; nothing in src reads it."
    verdict: document
    note: Provenance only; the request-side kwargs Clio sends come from the thinking mechanism, not this key.
  - name: quirks.llamaCpp.chatTemplateKwargs.<chatTemplateKwargs>
    kind: model-tag
    owner: providers
    controls: One template kwarg name and its value; provenance only; nothing in src reads it.
    verdict: document
    note: Provenance only.
  - name: quirks.llamaCpp.ctxSize
    kind: model-tag
    owner: providers
    controls: Recommended `--ctx-size`; provenance only; nothing in src reads it (the live window comes from the probe or `capabilities.contextWindow`).
    verdict: document
  - name: quirks.llamaCpp.flashAttn
    kind: model-tag
    owner: providers
    controls: Recommended `--flash-attn`; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.llamaCpp.mmproj
    kind: model-tag
    owner: providers
    controls: Says the server should load the multimodal projector (`--mmproj`); provenance only; nothing in src reads it (the probe infers vision from the running argv).
    verdict: document
    note: Provenance only.
  - name: quirks.llamaCpp.nGpuLayers
    kind: model-tag
    owner: providers
    controls: Recommended `--n-gpu-layers`; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.llamaCpp.parallel
    kind: model-tag
    owner: providers
    controls: Recommended `--parallel` slot count for starting the server; provenance only; nothing in src reads it, and admission uses the server's reported `total_slots` instead.
    verdict: keep
  - name: quirks.llamaCpp.parallelSlots
    kind: model-tag
    owner: providers
    controls: Free-text note on what `--parallel` means for admission and `--kv-unified`; provenance only; nothing in src reads it.
    verdict: document
    note: Provenance only; the typed `parallelSlots` capability is discovered from the server, never from this note.
  - name: quirks.llamaCpp.reasoning
    kind: model-tag
    owner: providers
    controls: Recommended `--reasoning` server default (`on`); provenance only; nothing in src reads it.
    verdict: keep
  - name: quirks.llamaCpp.reasoningEffort
    kind: model-tag
    owner: providers
    controls: Recommended `--reasoning-effort` server default; provenance only; nothing in src reads it, and per-request effort comes from `quirks.thinking.effortByLevel`.
    verdict: document
  - name: quirks.llamaCpp.specDraftNMax
    kind: model-tag
    owner: providers
    controls: Recommended `--spec-draft-n-max` for speculative decoding; provenance only; nothing in src reads it.
    verdict: document
  - name: quirks.llamaCpp.specType
    kind: model-tag
    owner: providers
